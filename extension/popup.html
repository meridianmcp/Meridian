<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meridian LaTeX</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 340px; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      #status { padding: 8px; border-radius: 6px; background: #f2f2f2; margin-bottom: 8px; }
      #status.ok { background: #e6f4ea; color: #1e7e34; }
      #status.missing { background: #fdecea; color: #a12622; }
      button { width: 100%; padding: 6px; margin-top: 6px; }
      #outline { padding: 8px; border-radius: 6px; background: #f2f2f2; margin-top: 8px;
        font-family: ui-monospace, monospace; white-space: pre-wrap; }
      #outline.error { background: #fdecea; color: #a12622; }
      #nodes { margin-top: 8px; max-height: 320px; overflow-y: auto; }
      .node-row { padding: 6px 8px; border-radius: 6px; background: #f8f8f8; margin-top: 6px; }
      .node-label { display: block; font-size: 12px; word-break: break-word; margin-bottom: 4px; }
      .node-row button { width: auto; padding: 3px 8px; margin-top: 2px; font-size: 12px; }
      .claim-result { font-size: 11px; margin-top: 4px; }
      .claim-result.ok { color: #1e7e34; }
      .claim-result.warning { color: #8a6100; }
      .claim-result.error { color: #a12622; }
    </style>
  </head>
  <body>
    <h1>Meridian LaTeX</h1>
    <div id="status">Checking for an Overleaf editor on this tab&hellip;</div>
    <button id="refresh">Re-check</button>
    <button id="get-outline">Get structural outline</button>
    <div id="outline" hidden></div>
    <div id="nodes" hidden></div>
  </body>
  <script src="popup.js"></script>
</html>
