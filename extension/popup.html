<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meridian LaTeX</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 260px; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      #status { padding: 8px; border-radius: 6px; background: #f2f2f2; margin-bottom: 8px; }
      #status.ok { background: #e6f4ea; color: #1e7e34; }
      #status.missing { background: #fdecea; color: #a12622; }
      button { width: 100%; padding: 6px; }
    </style>
  </head>
  <body>
    <h1>Meridian LaTeX</h1>
    <div id="status">Checking for an Overleaf editor on this tab&hellip;</div>
    <button id="refresh">Re-check</button>
  </body>
  <script src="popup.js"></script>
</html>
