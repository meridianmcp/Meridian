<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Meridian LaTeX</title>
    <style>
      body { font: 13px system-ui, sans-serif; width: 340px; padding: 12px; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      #status { padding: 8px; border-radius: 6px; background: #f2f2f2; margin-bottom: 8px; }
      #status.ok { background: #e6f4ea; color: #1e7e34; }
      #status.missing { background: #fdecea; color: #a12622; }
      button { width: 100%; padding: 6px; margin-top: 6px; }
      #outline { padding: 8px; border-radius: 6px; background: #f2f2f2; margin-top: 8px;
        font-family: ui-monospace, monospace; white-space: pre-wrap; }
      #outline.error { background: #fdecea; color: #a12622; }
      #cm6-info { padding: 8px; border-radius: 6px; background: #f2f2f2; margin-top: 8px;
        font-family: ui-monospace, monospace; white-space: pre-wrap; }
      #cm6-info.ok { background: #e6f4ea; color: #1e7e34; }
      #cm6-info.error { background: #fdecea; color: #a12622; }
      .section-divider { border-top: 1px solid #ddd; margin: 14px 0 8px; }
      .diagnostic-warning { font-size: 11px; color: #a12622; margin-bottom: 6px; }
      #test-edit-text { width: 100%; box-sizing: border-box; padding: 6px; margin-top: 4px; font: 12px ui-monospace, monospace; }
      #apply-edit-result { padding: 8px; border-radius: 6px; background: #f2f2f2; margin-top: 8px;
        font-family: ui-monospace, monospace; white-space: pre-wrap; font-size: 11px; }
      #apply-edit-result.ok { background: #e6f4ea; color: #1e7e34; }
      #apply-edit-result.warning { background: #fff8e1; color: #8a6100; }
      #apply-edit-result.error { background: #fdecea; color: #a12622; }
      #nodes { margin-top: 8px; max-height: 320px; overflow-y: auto; }
      .node-row { padding: 6px 8px; border-radius: 6px; background: #f8f8f8; margin-top: 6px; }
      .node-label { display: block; font-size: 12px; word-break: break-word; margin-bottom: 4px; }
      .node-row button { width: auto; padding: 3px 8px; margin-top: 2px; font-size: 12px; }
      .node-no-fields { display: block; font-size: 11px; color: #999; font-style: italic; }
      .claim-result { font-size: 11px; margin-top: 4px; }
      .claim-result.ok { color: #1e7e34; }
      .claim-result.warning { color: #8a6100; }
      .claim-result.error { color: #a12622; }
      .edit-field-row { display: flex; gap: 4px; margin-top: 6px; align-items: center; }
      .edit-field-label { font-size: 11px; color: #555; white-space: nowrap; }
      .edit-input { flex: 1; box-sizing: border-box; padding: 4px; font: 12px ui-monospace, monospace; }
      .save-edit-btn { width: auto; padding: 3px 8px; margin-top: 0; font-size: 12px; }
      .save-edit-btn.queued { background: #e6f4ea; color: #1e7e34; }
      .edit-result { font-size: 11px; margin-top: 4px; }
      .edit-result.ok { color: #1e7e34; }
      .edit-result.warning { color: #8a6100; }
      .edit-result.error { color: #a12622; }
      .zotero-status { font-size: 11px; white-space: nowrap; }
      .zotero-status.checking { color: #777; }
      .zotero-status.ok { color: #1e7e34; }
      .zotero-status.warn { color: #8a6100; }
      .zotero-status.unknown { color: #999; }
      #batch-bar { padding: 8px; border-radius: 6px; background: #eef4ff; margin-top: 8px; }
      #batch-bar-summary { font-size: 12px; margin-bottom: 6px; }
      #batch-bar-items { font-size: 11px; margin-bottom: 6px; }
      .batch-item-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; }
      .batch-item-remove { width: auto; padding: 1px 6px; margin-top: 0; font-size: 11px; }
      #batch-bar-actions { display: flex; gap: 6px; }
      #batch-bar-actions button { margin-top: 0; }
      #batch-apply-btn { background: #1a73e8; color: #fff; }
      #batch-cancel-btn { background: #f2f2f2; }
      #batch-result { font-size: 11px; margin-top: 6px; }
      #batch-result.ok { color: #1e7e34; }
      #batch-result.error { color: #a12622; }
    </style>
  </head>
  <body>
    <h1>Meridian LaTeX</h1>
    <div id="status">Checking for an Overleaf editor on this tab&hellip;</div>
    <button id="refresh">Re-check</button>
    <button id="get-outline">Get structural outline</button>
    <div id="outline" hidden></div>
    <div id="nodes" hidden></div>
    <div id="batch-bar" hidden>
      <div id="batch-bar-summary"></div>
      <div id="batch-bar-items"></div>
      <div id="batch-bar-actions">
        <button id="batch-apply-btn">Apply queued edits</button>
        <button id="batch-cancel-btn">Cancel all</button>
      </div>
      <div id="batch-result" hidden></div>
    </div>
    <button id="check-cm6">Check CM6 access</button>
    <div id="cm6-info" hidden></div>

    <div class="section-divider"></div>
    <h1>Write-back diagnostic</h1>
    <div class="diagnostic-warning">
      Test/diagnostic feature only -- inserts the text below at the very
      start of the live document. Do not point this at a real manuscript;
      use a disposable test project.
    </div>
    <input id="test-edit-text" type="text" placeholder="Text to insert at document start" />
    <button id="apply-test-edit">Insert test edit at document start</button>
    <div id="apply-edit-result" hidden></div>
  </body>
  <script src="popup.js"></script>
</html>
