name: Test (dev branch)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-core:
    runs-on: ubuntu-latest
    # 343cb26d — hard ceiling so a hung test (lingering asyncio loop / xdist
    # worker) can never keep the job "in progress" indefinitely. --timeout=60
    # below kills the individual test first; this is the backstop for the job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - run: pixi install
      - run: pixi run python -m pytest tests/ -n auto -q --tb=short --ignore=tests/test_demo_ux.py --timeout=60 --cov=meridian --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80

  test-ux:
    runs-on: ubuntu-latest
    # 343cb26d — backstop: the demo-UX suite drives a live uvicorn + Playwright,
    # the most likely place to leave a lingering process and hang the job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - run: pixi install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pixi.lock') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pixi run python -m playwright install chromium --with-deps
      - run: pixi run python -m pytest tests/test_demo_ux.py -q --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pip install ruff
      - name: Lint (warn only — violations do not fail CI yet)
        run: ruff check . || true

  frontend:
    # 8e29733e — TypeScript strict type-check + Preact component coverage gate.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Type-check (strict)
        run: npx tsc --noEmit
      - name: Build dashboard bundle
        run: node build.mjs
      - name: Component unit tests + coverage gate (70%+)
        run: npx vitest run --coverage

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - run: pixi install
      - name: Regenerate MCP tool docs
        run: pixi run python scripts/gen_docs.py
      - name: Fail if docs/mcp-tools.md is stale
        run: |
          if ! git diff --exit-code docs/mcp-tools.md; then
            echo "ERROR: docs/mcp-tools.md is out of date. Run 'pixi run python scripts/gen_docs.py' and commit the result."
            exit 1
          fi
