name: Test (dev branch)

# f4ab2787 — Canonical dev/PR CI. deploy.yml's workflow_run trigger treats
# this workflow's whole conclusion as the promotion gate. The workflow name is
# therefore a cross-file API; update deploy.yml if it changes. deploy.yml's
# inline jobs are narrower supplemental release checks, not a substitute for
# this workflow. See divergent runs 30182367824 and 30182376358.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # baead5fa — skip .pyc writes for the throwaway CI filesystem; pure overhead
  # when the runner is destroyed after the job anyway.
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  test-core:
    runs-on: ubuntu-latest
    # 343cb26d — hard ceiling so a hung test (lingering asyncio loop / xdist
    # worker) can never keep the job "in progress" indefinitely. --timeout=60
    # below kills the individual test first; this is the backstop for the job.
    timeout-minutes: 15
    env:
      # 61f891b0 — sys.monitoring, Python 3.12+: 53% relative reduction in
      # coverage overhead at comparable scale (documented, Warehouse/PyPI).
      # Scoped to test-core only -- test-postgres runs no --cov flag.
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - run: pixi install
      # 807d8c28 — coverage floor ratcheted 80 -> 82 (measured ~82.4%). The 85%
      # aspiration needs a dedicated sprint on server.py / routes/tunnel.py.
      # 696bf9d6 — --durations=20 surfaces the 20 slowest tests in every run so the
      # test-core duration regression (53s -> 301s) can be attributed to real
      # per-test timings before any fast/slow job split, rather than guessed.
      # bad568b5 — analysis recorded in tests/PERF_test_core_durations.md: the cost
      # is per-test `client`-fixture setup (importlib.reload(meridian.server) on
      # ~390/946 tests), not any single slow test. Keep --durations so the fix's
      # before/after is measurable.
      # baead5fa — worksteal instead of default load-scope: duration data (see
      # tests/PERF_test_core_durations.md) shows uneven per-test cost (the
      # client-fixture reload tax hits ~390/946 tests unevenly), so static
      # up-front chunking leaves some workers idle while others queue. worksteal
      # dynamically redistributes remaining tests, which only helps under that
      # kind of imbalance and can't hurt evenly-distributed runs.
      #
      # e71ecf27 — real CI timing data collected 2026-07-14 (GitHub Actions,
      # ubuntu-latest, the actual target platform):
      #   PRE-change (7 runs, no --dist=worksteal):
      #     test-core: 386 389 392 402 403 418 433s  median=402s  avg=403s
      #   POST-change (1 run, --dist=worksteal):
      #     test-core: 437s
      # The single post-change run lands above the pre-change median (+35s, ~8.7%),
      # but with n=1 this is NOT statistically conclusive — the pre-change range
      # itself spans 386–433s (47s spread), so 437s could be noise. Sample size is
      # too small for a confident verdict. Keeping the change: it is correctness-
      # neutral, theoretically justified by the documented load imbalance, and the
      # data does not clearly show a regression. Revisit if additional CI runs
      # consistently land above the pre-change range.
      # test_rate_limit_serial.py excluded here and run separately below — its
      # moving-window rate-limit tests depend on real wall-clock deltas between
      # their own requests, which parallel + --cov load can stretch
      # past the window (see that file's module docstring).
      - run: pixi run python scripts/run_tests.py tests/ -q --tb=short --ignore=tests/test_demo_ux.py --ignore=tests/test_rate_limit_serial.py --cov=meridian --cov-config=.coveragerc
      - run: pixi run python scripts/run_tests.py --serial tests/test_rate_limit_serial.py -q --tb=short --cov=meridian --cov-config=.coveragerc --cov-append --cov-report=term-missing --cov-fail-under=82

  test-postgres:
    # KEYSTONE 98aa7eb7 (pinned decision f70b731a — Postgres correctness is
    # non-negotiable). test-core above runs on SQLite (:memory:), but prod runs
    # Postgres, which has hidden real bugs SQLite could not (e.g. the b7f41c73
    # datetime-serialization regression). This job runs the SAME suite a second
    # time against a real postgres:16 service container so those Postgres-only
    # failures surface in CI, not prod. The conftest `db`/`client` fixtures route
    # to Postgres whenever TEST_DATABASE_URL is set (SQLite otherwise), so no test
    # code changes are needed — only this env var.
    #
    # NON-BLOCKING FOR NOW (98aa7eb7 first run, 2026-07-07): the very first Postgres
    # run surfaced 232 pre-existing PG-incompatibility failures the SQLite CI had
    # always hidden — schema columns/tables missing from CREATE_TABLES_CORE /
    # _PG_MIGRATIONS vs the SQLite path (e.g. sprint_items.depends_on,
    # registered_hostnames), `timestamptz < text` comparisons, and result-ordering
    # differences. Fixing those is a real, tracked follow-up effort; until the PG
    # suite is green this job REPORTS the signal without red-walling every push.
    # Remove continue-on-error to make it blocking again once green, per f70b731a
    # (Postgres correctness is non-negotiable).
    continue-on-error: true
    runs-on: ubuntu-latest
    # Same hard ceiling as test-core: a hung test/loop can never keep the job
    # "in progress" forever. --timeout=60 kills the individual test first.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meridian
          POSTGRES_PASSWORD: meridian
          POSTGRES_DB: meridian_test
        ports:
          - 5432:5432
        # Wait for Postgres to accept connections before the job's steps run so
        # the first fixture doesn't race a not-yet-ready server.
        options: >-
          --health-cmd "pg_isready -U meridian -d meridian_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Consumed by tests/conftest.py to route the `db`/`client` fixtures onto
      # the service container. Host is localhost because the container port is
      # published to the runner. Kept off the demo/main DB env vars on purpose.
      TEST_DATABASE_URL: postgresql://meridian:meridian@localhost:5432/meridian_test
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - run: pixi install
      # Postgres-backed run. No coverage gate here — test-core already enforces
      # the coverage floor on the identical suite; this job's job is backend
      # correctness. scripts/run_tests.py (not a literal -n flag here) shards
      # across up to MERIDIAN_TEST_MAX_WORKERS (default 8, -n auto/worksteal)
      # once collection exceeds its serial threshold; each xdist worker gets
      # its own database (meridian_test_gw0, _gw1, … — created on demand by
      # conftest) and drops/recreates the public schema per test, so workers
      # stay fully isolated even though every test rebuilds the schema.
      #
      # e71ecf27 — real CI timing data collected 2026-07-14:
      #   PRE-change (7 runs): 445 445 466 485 502 510 690s  median=485s  avg=506s
      #   POST-change (1 run): 519s  (job failed due to pre-existing PG failures,
      #     not worksteal; continue-on-error is intentional per 98aa7eb7)
      # Single post-change run is within the pre-change spread (445–690s range).
      # Sample size too small for a confident verdict; keeping --dist=worksteal.
      # test_rate_limit_serial.py excluded here and run separately below (same
      # reason as test-core above — see that file's module docstring).
      - run: pixi run python scripts/run_tests.py tests/ -q --tb=short --ignore=tests/test_demo_ux.py --ignore=tests/test_rate_limit_serial.py
      - run: pixi run python scripts/run_tests.py --serial tests/test_rate_limit_serial.py -q --tb=short

  test-ux:
    runs-on: ubuntu-latest
    # 343cb26d — backstop: the demo-UX suite drives a live uvicorn + Playwright,
    # the most likely place to leave a lingering process and hang the job.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - run: pixi install
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('pixi.lock') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pixi run python -m playwright install chromium --with-deps
      - run: pixi run python -m pytest tests/test_demo_ux.py -n auto -q --tb=short

  # 0ab8139f -- fail-closed dependency-contract gate for the local tunnel
  # extension servers (meridian-docs, meridian-outputs), run BEFORE the
  # meridian-docs job's install/test steps below (via `needs:`). Root cause
  # (GitHub Actions run 31047597879, origin/dev commit 5390b65):
  # meridian-docs CI installed the committed manifest with
  # dependencies=["mcp>=1.0", "latex2mathml>=2.0"]; pip resolved mcp==2.0.0,
  # which removed mcp.server.fastmcp (both extensions' entry points import
  # it), so the job died with a ModuleNotFoundError deep inside pytest
  # collection instead of a clear, named, early failure. Board item 106caa76
  # (commit 324bfbf) pinned mcp>=1.27,<2 in both manifests; this job is the
  # CI-side guarantee that a regression on that pin (or its future
  # equivalent) can never again surface as a buried collection error.
  #
  # Two-stage, scripts/preflight_extension_dependencies.py-backed (a small,
  # independently unit-tested Python script -- see
  # tests/test_ci_extension_dependency_preflight.py -- rather than an inline
  # shell block, since a workflow YAML step itself can't practically be
  # unit-tested):
  #   1. "manifest" needs no install at all: it reads the two COMMITTED
  #      pyproject.toml files directly and asserts their declared `mcp`
  #      specifier both excludes the 2.x major and has a lower bound >=1.27
  #      -- parsed as real version clauses, never a literal string compare,
  #      so a legitimate future bump (e.g. >=1.28,<2) keeps passing. This is
  #      what makes "a deliberately stale manifest fails before suite
  #      collection with an actionable message" true: it fails before either
  #      extension is even installed.
  #   2. "import" runs AFTER both extensions are actually installed in this
  #      job's fresh Python (pip install -e, same as meridian-docs's own
  #      install step below) and imports mcp.server.fastmcp plus each
  #      extension's server module, asserting `<module>.mcp` is a real
  #      FastMCP instance -- the literal regression check for the crash
  #      itself, not just the manifest text.
  #
  # Promotion parity (0ab8139f acceptance criterion): deploy.yml's
  # auto-promote job merges the EXACT SHA that passed this workflow
  # (`workflow_run.head_sha`), never a newer/untested dev tip (see that
  # job's own comments) -- so making this job a required, non-continue-on-
  # error part of "Test (dev branch)"'s conclusion is *itself* the
  # promotion-parity guarantee: no SHA lacking this dependency contract can
  # reach main via the routine auto-promote path. deploy.yml is
  # deliberately NOT edited here (out of this item's declared scope, and
  # out of reach for changes that could plausibly touch deploy
  # credentials/live infra); see this item's completion notes for the
  # honest accounting of what that leaves deferred (an explicit
  # belt-and-suspenders re-check inside deploy.yml itself, for the
  # non-routine hotfix/manual-dispatch promotion paths that don't flow
  # through this workflow_run gate).
  extension-dependency-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate committed extension manifests pin a compatible mcp major
        run: python scripts/preflight_extension_dependencies.py manifest
      - name: Install both extensions (editable) -- same install shape as the meridian-docs job below
        run: |
          pip install -e extensions/meridian-docs
          pip install -e extensions/meridian-outputs
      - name: Verify mcp.server.fastmcp and both entry points import in the freshly-installed environment
        run: python scripts/preflight_extension_dependencies.py import

  meridian-docs:
    # 9a817fce (W2-D) -- extensions/meridian-docs is a separate, stdlib-only
    # distribution that is NOT wired into pixi.toml's pypi-dependencies (see
    # tests/test_meridian_docs_equations.py's own sys.path-insertion workaround,
    # which exists precisely because the extension lives outside the main
    # dependency graph), so its full test suite -- including the real Word/COM
    # DOCX regression coverage this item adds in
    # extensions/meridian-docs/tests/test_docx_word_com_regression.py -- never
    # ran in CI at all before this job existed. LibreOffice gives ubuntu-latest
    # a REAL, cross-platform render backend
    # (render_gate.check_render_capability's default backend chain already
    # tries "soffice"/"libreoffice" before the Windows-only Word COM backend),
    # so the regression suite's "rendered" branch gets genuine backend-verified
    # evidence here, not just its structural-validation fallback. Word COM
    # itself (render_gate._word_com_unavailable_reason) is Windows-only and is
    # only ever exercised on a Windows box with Word actually installed; the
    # regression tests fall back to independent structural validation whenever
    # NO render backend is available at all (e.g. if this job's LibreOffice
    # install step ever regresses) -- that fallback path is real, asserted
    # coverage, never a silent skip, so this job stays a meaningful blocking
    # gate either way.
    #
    # 0ab8139f -- needs: extension-dependency-preflight so a broken mcp pin
    # fails fast (no LibreOffice install, no extension install) with the
    # named, actionable preflight failure above instead of resurfacing as a
    # ModuleNotFoundError buried in this job's own pytest collection.
    needs: extension-dependency-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice Writer (real cross-platform render backend)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer
      - name: Install meridian-docs (editable) + test deps
        run: |
          pip install -e extensions/meridian-docs
          pip install pytest pytest-timeout
      - run: python -m pytest extensions/meridian-docs/tests -q --tb=short --timeout=60

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ruff
        run: pip install ruff
      # 736d300e — BLOCKING correctness lint. `ruff check .` honors the curated
      # [tool.ruff.lint].select set in pyproject.toml: a subset of pyflakes
      # correctness rules (F821 undefined-name, F50x bad format strings, F70x
      # misplaced statements, F63x nonsensical comparisons, …) that is already
      # at 0 violations. No `|| true` — a regression here fails the build.
      - name: Lint (correctness rules — BLOCKING)
        run: ruff check .
      # Warn-only broad pass: surfaces the noisy style/import backlog (F401,
      # F405, F841, F541, E4xx/E7xx, …) in the logs WITHOUT failing CI. Graduate
      # a rule into the blocking select set (above) once its count reaches 0.
      - name: Lint (full rule set — warn only, does not fail CI)
        run: ruff check . --select F,E --statistics || true
      # 178ed93e (refiled, original 691d367b stuck) — BLOCKING pre-merge AST
      # check for orphaned local references: renamed/removed first-party
      # functions with a dangling `from X import Y` or `module.attr` caller.
      # Deliberately NOT the codebase graph's CALLS-edge confidence (too
      # noisy, confirmed live) — a dedicated deterministic AST
      # name-resolution walk instead. Stdlib-only (ast/dataclasses/pathlib),
      # no pixi env needed. At 0 violations as of this change.
      - name: AST check for orphaned local references
        run: python3 scripts/check_orphaned_refs.py

  frontend:
    # 8e29733e — TypeScript strict type-check + Preact component coverage gate.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Type-check (strict)
        run: npx tsc --noEmit
      - name: Build dashboard bundle
        run: node build.mjs
      - name: Component unit tests + coverage gate (70%+)
        run: npx vitest run --coverage

  docs-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - run: pixi install
      - name: Regenerate MCP tool docs and API reference
        run: pixi run python scripts/gen_docs.py
      - name: Fail if docs/mcp-tools.md is stale
        run: |
          if ! git diff --exit-code docs/mcp-tools.md; then
            echo "ERROR: docs/mcp-tools.md is out of date. Run 'pixi run python scripts/gen_docs.py' and commit the result."
            exit 1
          fi
      - name: Fail if docs/api-reference.md is stale
        run: |
          if ! git diff --exit-code docs/api-reference.md; then
            echo "ERROR: docs/api-reference.md is out of date. Run 'pixi run python scripts/gen_docs.py' and commit the result."
            exit 1
          fi
