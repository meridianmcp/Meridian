name: Repair hosted custom-domain TLS

on:
  workflow_dispatch:
    inputs:
      hostname:
        description: Custom hostname to repair
        required: false
        default: usemeridian.us
        type: string

permissions:
  contents: read

jobs:
  repair:
    name: Reconcile Fly certificate and verify public TLS
    runs-on: ubuntu-latest
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect and reconcile certificate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          HOSTNAME: ${{ inputs.hostname }}
        shell: bash
        run: |
          set -u
          app="meridian-hosted"
          host="${HOSTNAME:-usemeridian.us}"

          echo "== Current certificate state =="
          flyctl certs check "$host" --app "$app" --json || true
          echo "== Certificate setup / DNS requirements =="
          flyctl certs setup "$host" --app "$app" --json || true

          echo "== Idempotent certificate reconciliation =="
          flyctl certs add "$host" --app "$app" --json

          echo "== Certificate state after reconciliation =="
          flyctl certs check "$host" --app "$app" --json || true

      - name: Verify public endpoint
        env:
          HOSTNAME: ${{ inputs.hostname }}
        shell: bash
        run: |
          set -u
          host="${HOSTNAME:-usemeridian.us}"
          for attempt in $(seq 1 18); do
            status=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 "https://${host}/health" || true)
            echo "Attempt ${attempt}: https://${host}/health = ${status}"
            if [ "$status" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done

          echo "Public TLS/health did not recover after certificate reconciliation."
          exit 1
