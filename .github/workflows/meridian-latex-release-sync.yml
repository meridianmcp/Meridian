name: Sync meridian-latex release with core releases

# Keeps @meridianmcp/latex from silently going stale relative to core
# Meridian releases. Without this workflow, meridian-latex only gets a new
# npm release when someone REMEMBERS to push a meridian-latex-vX.Y.Z tag by
# hand (see meridian-latex-publish.yml) -- unrelated to the main product's
# own vX.Y.Z release cadence (release.yml / npm-publish.yml).
#
# This workflow does NOT publish to npm itself and does NOT touch
# secrets.NPM_TOKEN. It only:
#   1. Checks whether extensions/meridian-latex/** changed since the last
#      meridian-latex release tag (or since the previous core tag, if no
#      meridian-latex tag has ever been cut).
#   2. If so, creates+pushes a meridian-latex-v<same-version> tag, reusing
#      the core tag's version number so the two numbering schemes stay
#      visibly correlated.
#   3. Explicitly dispatches meridian-latex-publish.yml against that tag.
#      That workflow already owns the real `test` + `npm publish` logic
#      (triggered normally by its own tag pattern) -- this never duplicates
#      that logic, it only makes sure that pipeline actually runs.
#
# Step 3 is NOT redundant with step 2's tag push: GitHub does not fire
# push-triggered workflow runs for pushes made with the default
# GITHUB_TOKEN (anti-recursion). deploy.yml's auto-promote/merge-to-main
# jobs and docs.yml's post-promote dispatch already hit this exact
# limitation and work around it the same way -- an explicit
# `gh workflow run <workflow> --ref <ref>` dispatch, which IS exempt from
# that suppression. See meridian-latex-publish.yml's own `workflow_dispatch`
# trigger comment for the receiving side of this.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

jobs:
  check-and-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create + push the meridian-latex-v* tag
      actions: write  # dispatch meridian-latex-publish.yml
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags -- needed to diff against the last release
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine whether extensions/meridian-latex changed since its last release
        id: check
        run: |
          set -euo pipefail

          CORE_TAG="${GITHUB_REF_NAME}"
          VERSION="${CORE_TAG#v}"
          LATEX_TAG="meridian-latex-v${VERSION}"
          echo "Core release tag: $CORE_TAG (version $VERSION) -> candidate meridian-latex tag: $LATEX_TAG"

          # Version-aware sort so e.g. v1.10.0 correctly sorts after v1.9.0.
          LAST_LATEX_TAG=$(git tag --list 'meridian-latex-v[0-9]*' --sort=-v:refname | head -n1 || true)

          if [[ -n "$LAST_LATEX_TAG" ]]; then
            echo "Last meridian-latex release tag: $LAST_LATEX_TAG"
            RANGE="${LAST_LATEX_TAG}..HEAD"
          else
            # No meridian-latex tag has ever been cut (e.g. right after the
            # subtree merge). Fall back to the previous CORE tag so this
            # first-ever check doesn't treat all of history as "changed".
            PREV_CORE_TAG=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -vFx "$CORE_TAG" | head -n1 || true)
            if [[ -n "$PREV_CORE_TAG" ]]; then
              echo "No meridian-latex tag yet; comparing against previous core tag: $PREV_CORE_TAG"
              RANGE="${PREV_CORE_TAG}..HEAD"
            else
              echo "No meridian-latex tag and no previous core tag found; treating full history as in-scope."
              RANGE="HEAD"
            fi
          fi

          if [[ "$RANGE" == "HEAD" ]]; then
            CHANGED_COUNT=$(git log HEAD --oneline -- extensions/meridian-latex/ | wc -l)
          else
            CHANGED_COUNT=$(git log "$RANGE" --oneline -- extensions/meridian-latex/ | wc -l)
          fi
          echo "Commits touching extensions/meridian-latex/ in range '$RANGE': $CHANGED_COUNT"

          if [[ "$CHANGED_COUNT" -gt 0 ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "latex_tag=$LATEX_TAG" >> "$GITHUB_OUTPUT"

      - name: Skip -- no meridian-latex changes since its last release
        if: steps.check.outputs.changed == 'false'
        run: echo "No commits under extensions/meridian-latex/ since its last release tag. Nothing to sync for ${{ github.ref_name }}."

      - name: Check whether the target meridian-latex tag already exists
        if: steps.check.outputs.changed == 'true'
        id: existing
        run: |
          if git rev-parse "refs/tags/${{ steps.check.outputs.latex_tag }}" >/dev/null 2>&1; then
            echo "${{ steps.check.outputs.latex_tag }} already exists -- skipping (idempotent re-run)."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create and push the meridian-latex release tag
        if: steps.check.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        run: |
          set -euo pipefail
          TAG="${{ steps.check.outputs.latex_tag }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "meridian-latex release synced with core $GITHUB_REF_NAME" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Pushed $TAG -> $GITHUB_SHA"

      - name: Trigger meridian-latex-publish.yml for the new tag
        # The tag push above uses the default GITHUB_TOKEN, so it will NOT
        # itself trigger meridian-latex-publish.yml's push/tags trigger
        # (GitHub's anti-recursion rule for GITHUB_TOKEN-authored pushes --
        # see this workflow's header comment). Dispatch it explicitly instead,
        # against the tag ref, so github.ref inside that run is the tag itself.
        if: steps.check.outputs.changed == 'true' && steps.existing.outputs.exists == 'false'
        run: gh workflow run meridian-latex-publish.yml --ref "${{ steps.check.outputs.latex_tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
