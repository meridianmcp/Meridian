name: Tray smoke spike (windows-latest)

# Throwaway spike, decision e3bf0981 / item 6094a084: can a tray icon and a Tk
# window be started AND observed on a GitHub-hosted Windows runner? Runs only on
# the spike branch and by hand; never on dev, main or a pull request; no secrets,
# read-only token, nothing is published or deployed.
on:
  push:
    branches: ['spike/tray-smoke-**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Install spike dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pystray pillow pywinauto

      - name: Run the spike
        shell: pwsh
        run: python scripts/spike_tray_smoke.py --out spike_out

      - name: Print the report
        if: always()
        shell: pwsh
        run: |
          if (Test-Path spike_out/spike_report.json) { Get-Content spike_out/spike_report.json } else { Write-Output 'no report written' }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tray-smoke-spike
          path: spike_out/
          if-no-files-found: warn
          retention-days: 7
