name: "meridian-latex: Test & Publish"

# meridian-latex moved into extensions/meridian-latex/ from its own
# standalone repo (git subtree, full history preserved). It publishes as
# its own npm package (@meridianmcp/latex, a separate registry entry from
# the main product's own @meridianmcp/mcp), so it needs its OWN tag
# namespace -- "meridian-latex-vX.Y.Z", never the bare "vX.Y.Z" pattern
# release.yml/npm-publish.yml already use for the main product's own
# releases. Reusing that pattern would make a normal Meridian release tag
# ALSO try to re-version and publish meridian-latex, which is wrong.
#
# `test` runs on any push/PR that touches extensions/meridian-latex/** --
# scoped by path so unrelated Meridian commits don't waste CI time on it.
# `npm-publish` only runs on a meridian-latex-vX.Y.Z tag, after `test`
# passes, and reuses the same NPM_TOKEN secret already configured for
# @meridianmcp/mcp (same npm org, meridianmcp) -- an agent session must
# never generate, see, or handle that token itself.
#
# workflow_dispatch exists for exactly one caller: meridian-latex-release-sync.yml.
# That workflow creates+pushes a meridian-latex-vX.Y.Z tag using the default
# GITHUB_TOKEN -- and GitHub does NOT fire push-triggered workflow runs from
# GITHUB_TOKEN-authored pushes (the same anti-recursion rule deploy.yml's
# auto-promote/merge-to-main jobs and docs.yml's dispatch already document and
# work around). workflow_dispatch IS exempt from that suppression, so
# meridian-latex-release-sync.yml dispatches this workflow explicitly
# (`gh workflow run ... --ref meridian-latex-vX.Y.Z`) right after pushing the
# tag, which makes github.ref equal that tag ref for the dispatched run --
# satisfying the npm-publish job's existing `startsWith(..., 'refs/tags/
# meridian-latex-v')` condition below unchanged. No inputs needed.
#
# `cache-dependency-path` below points at the ROOT package-lock.json, not a
# per-package one under extensions/meridian-latex/engine/ -- since the repo
# root became an npm workspace (linking npm/ and this engine together),
# `npm ci`/`npm install` anywhere in the tree resolve and write ONLY the root
# lockfile; a per-package lockfile is no longer read or maintained by npm at
# all and was deleted for exactly that reason (it had silently drifted out of
# sync with package.json, and a stale cache-dependency-path pointing at it
# meant the GitHub Actions npm-cache key never changed when real dependencies
# did). `npm ci` with `working-directory: extensions/meridian-latex/engine`
# still installs correctly with no lockfile in that directory -- npm detects
# the workspace root and installs from there regardless of cwd.

on:
  push:
    branches: [dev, main]
    paths:
      - 'extensions/meridian-latex/**'
    tags:
      - 'meridian-latex-v[0-9]+.[0-9]+.[0-9]+'
      - 'meridian-latex-v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches: [dev, main]
    paths:
      - 'extensions/meridian-latex/**'
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/meridian-latex/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test

  npm-publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/meridian-latex-v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/meridian-latex/engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Sync package.json version to the tag
        run: |
          TAG="${GITHUB_REF_NAME#meridian-latex-v}"
          npm version "$TAG" --no-git-tag-version --allow-same-version
      - name: Publish (pre-release tags get the "next" dist-tag, not "latest")
        run: |
          if [[ "${GITHUB_REF_NAME}" == *"-"* ]]; then
            npm publish --tag next
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
