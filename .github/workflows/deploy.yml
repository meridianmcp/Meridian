name: Deploy to Fly.io

# Pipeline: dev push → test → preview → smoke → merge main → prod (with rollback)
# Production deploys ONLY happen when:
#   (a) dev branch smoke tests pass and auto-merge fires, OR
#   (b) a version tag is pushed, OR
#   (c) manual workflow_dispatch
# NEVER deploy prod directly from a dev push — always go through preview first.

on:
  push:
    branches: [dev, main]
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── 1. Tests ───────────────────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - run: pixi install
      - run: pixi run python -m playwright install chromium --with-deps
      - run: pixi run test

  # ─── 2. Preview deploy (dev branch only) ────────────────────────────────────
  deploy-preview:
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to meridian-preview
        run: flyctl deploy --remote-only --config fly-preview.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PREVIEW }}

  # ─── 3. Smoke tests against preview ─────────────────────────────────────────
  smoke-preview:
    needs: deploy-preview
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for preview to wake
        run: sleep 15

      - name: Health check
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://meridian-preview.fly.dev/health)
          echo "Health: $STATUS"
          [ "$STATUS" = "200" ] || (echo "FAIL: /health returned $STATUS" && exit 1)

      - name: Landing page loads
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://meridian-preview.fly.dev/)
          echo "Landing: $STATUS"
          [ "$STATUS" = "200" ] || (echo "FAIL: / returned $STATUS" && exit 1)

      - name: Demo page loads
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://meridian-preview.fly.dev/demo)
          echo "Demo: $STATUS"
          [ "$STATUS" = "200" ] || (echo "FAIL: /demo returned $STATUS" && exit 1)

      - name: MCP tools/list responds
        run: |
          RESP=$(curl -s -X POST https://meridian-preview.fly.dev/mcp/sse \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          echo "$RESP" | grep -q '"start_session"' || (echo "FAIL: MCP tools missing start_session" && exit 1)
          echo "MCP tools OK"

  # ─── 4. Merge dev → main once smoke tests pass ───────────────────────────────
  merge-to-main:
    needs: smoke-preview
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge dev → main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git merge --ff-only origin/dev
          git push origin main

  # ─── 5. Production deploy (main branch push or tag or manual) ────────────────
  # Triggered by the merge above (main push) or explicit workflow_dispatch / tag.
  # Canary strategy: 1 machine takes traffic first — if unhealthy, Fly rolls back.
  deploy:
    needs: test
    if: >
      (github.ref == 'refs/heads/main' &&
       github.event_name == 'push' &&
       github.actor == 'github-actions[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      deployed_version: ${{ steps.deploy.outputs.deployed_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Record pre-deploy image
        id: pre_deploy
        run: |
          IMAGE=$(flyctl image show --app meridian-hosted --json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('ref',''))" || echo "")
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to production (canary)
        id: deploy
        run: |
          flyctl deploy --remote-only --config fly.toml --strategy=canary
          echo "deployed_version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Post-deploy smoke test
        id: smoke
        run: |
          sleep 20
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://usemeridian.us/health)
          echo "Health: $STATUS"
          [ "$STATUS" = "200" ] || (echo "FAIL: prod /health returned $STATUS" && exit 1)
        continue-on-error: true

      - name: Rollback on smoke failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke test failed — rolling back to previous image"
          PREV="${{ steps.pre_deploy.outputs.image }}"
          if [ -n "$PREV" ]; then
            flyctl deploy --image "$PREV" --app meridian-hosted --strategy=immediate
          else
            echo "No previous image recorded — manual rollback required"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Fail job if smoke test failed (after rollback attempt)
        if: steps.smoke.outcome == 'failure'
        run: exit 1

  # ─── 6. CHANGELOG (after prod deploy on main) ────────────────────────────────
  changelog:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - name: Generate CHANGELOG
        run: pixi run git-cliff --output CHANGELOG.md
      - name: Commit CHANGELOG.md if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore: update CHANGELOG"
            git push origin HEAD:main
          fi
