name: Deploy to Fly.io

# f4ab2787 — test.yml is the canonical dev promotion gate. Its entire
# workflow conclusion (tests, blocking lint, frontend, docs, and UX) controls
# auto-promotion. The inline jobs below are supplemental preview/release checks
# for push, tag, and dispatch paths; they are intentionally not equivalent and
# must not be read as proof that canonical dev CI passed. workflow_run skips
# them because test.yml already ran.
#
# Regression evidence: canonical run 30182367824 failed while direct-main
# deploy run 30182376358 passed its narrower supplemental checks.

# Pipeline: dev push → test → preview → smoke → merge main → prod (with rollback)
# Production deploys ONLY happen when:
#   (a) dev branch smoke tests pass and auto-merge fires, OR
#   (b) a version tag is pushed, OR
#   (c) manual workflow_dispatch
# NEVER deploy prod directly from a dev push — always go through preview first.

on:
  push:
    branches: [dev, main]
    tags: ['v*.*.*']
  # 427b7902 — AUTO-PROMOTE dev -> main on green CI. When the dev-branch CI
  # workflow ("Test (dev branch)" = test.yml) finishes, this deploy workflow
  # re-runs on the `workflow_run` event; the `auto-promote` job below fires the
  # dev->main merge ONLY when that run concluded `success` on the `dev` branch.
  # No operator `promote=yes` dispatch is needed for the routine green path.
  # Loop-safety: the merge pushes to `main` with the default GITHUB_TOKEN, whose
  # pushes do NOT trigger new workflow runs (GitHub's built-in anti-recursion) —
  # so the merge cannot re-fire test.yml or this workflow. Prod is deployed by an
  # explicit `gh workflow run deploy.yml --ref main` dispatch (workflow_dispatch
  # DOES fire under GITHUB_TOKEN), exactly as the operator-gated promote path does,
  # leaving exactly ONE prod deploy per promote (the main-ref dispatch).
  workflow_run:
    workflows: ["Test (dev branch)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      promote:
        description: 'Set to "yes" to merge dev → main and roll prod. Anything else = no-op.'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'
      hotfix:
        description: 'Set to "yes" to skip coverage + preview and deploy straight to prod (emergency only).'
        required: false
        default: 'no'
        type: choice
        options:
          - 'no'
          - 'yes'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── 1. Tests (skipped entirely for hotfix) ────────────────────────────────
  test:
    name: Supplemental preview/release test gate
    runs-on: ubuntu-latest
    # Skip on the workflow_run auto-promote event — test.yml already ran the full
    # suite; re-running it here would be wasteful and pointless. (427b7902)
    if: inputs.hotfix != 'yes' && github.event_name != 'workflow_run'
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: latest
          cache: true
      - run: pixi install
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pixi run python -m playwright install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pixi run python -m playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - name: Run tests (fast for hotfix, full with coverage otherwise)
        run: |
          if [ "${{ inputs.hotfix }}" = "yes" ]; then
            pixi run python -m pytest tests/test_core.py tests/test_new_v25.py tests/test_hosted.py tests/test_security.py -n 3 -q --tb=short
          else
            pixi run test-cov
          fi

  playwright-tests:
    name: Supplemental Playwright signal
    runs-on: ubuntu-latest
    continue-on-error: true
    # Skip on the workflow_run auto-promote event (test.yml already covers UX). (427b7902)
    if: github.event_name != 'workflow_run'
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: latest
          cache: true
      - run: pixi install
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pixi.lock') }}
          restore-keys: playwright-${{ runner.os }}-
      - run: pixi run python -m playwright install chromium --with-deps
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: pixi run python -m playwright install chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: pixi run python -m pytest tests/test_demo_ux.py -q --tb=short

  # ─── 2. Preview deploy (dev branch only, skip for hotfix) ────────────────
  # meridian-preview is the real "nightly" channel: this is the ONLY job that
  # deploys it, always from the latest dev commit that just passed `test`
  # above. (cd9c2bf7 -- a second job, `refresh-preview`, used to also redeploy
  # this same app from `main` right after every prod promotion; since
  # auto-promote fires within minutes of most green dev pushes, that
  # collapsed preview back to "identical to prod" almost immediately instead
  # of tracking dev. Removed rather than retargeted, since duplicating this
  # exact `flyctl deploy` on a dev trigger would just run it twice per push.)
  deploy-preview:
    needs: test
    if: github.ref == 'refs/heads/dev' && inputs.hotfix != 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to meridian-preview
        run: flyctl deploy --remote-only --config fly-preview.toml --build-arg MERIDIAN_GIT_SHA=$(git rev-parse --short=12 HEAD)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PREVIEW }}

  # ─── 3. Smoke tests against preview (skip for hotfix) ────────────────────
  smoke-preview:
    needs: deploy-preview
    if: github.ref == 'refs/heads/dev' && inputs.hotfix != 'yes'
    runs-on: ubuntu-latest
    steps:
      - name: Wait for preview to boot (retry /health up to 90s)
        run: |
          BASE="https://meridian-preview.fly.dev"
          echo "Waiting for /health..."
          for i in $(seq 1 9); do
            STATUS=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" "$BASE/health" || echo "000")
            echo "Attempt $i: $STATUS"
            [ "$STATUS" = "200" ] && break
            [ "$i" = "9" ] && (echo "FAIL: /health never returned 200" && exit 1)
            sleep 10
          done

      - name: Landing page loads
        run: |
          STATUS=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" https://meridian-preview.fly.dev/)
          echo "Landing: $STATUS"
          [ "$STATUS" = "200" ] || (echo "FAIL: / returned $STATUS" && exit 1)

      - name: Demo page loads
        run: |
          STATUS=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" https://meridian-preview.fly.dev/demo)
          echo "Demo: $STATUS"
          [ "$STATUS" = "200" ] || (echo "FAIL: /demo returned $STATUS" && exit 1)

      - name: MCP tools/list responds
        run: |
          RESP=$(curl -s --max-time 15 -X POST https://meridian-preview.fly.dev/mcp/sse \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list","params":{}}')
          echo "$RESP" | grep -q '"start_session"' || (echo "FAIL: MCP tools missing start_session" && exit 1)
          echo "MCP tools OK"

  # ─── 4. Merge dev → main on operator-gated promotion ──────────────────────
  merge-to-main:
    needs: [smoke-preview, test]
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.promote == 'yes' &&
      github.ref == 'refs/heads/dev' &&
      (inputs.hotfix == 'yes' || needs.smoke-preview.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge dev → main
        id: merge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          git checkout main
          PRE_SHA=$(git rev-parse HEAD)
          git merge --no-ff --no-edit origin/dev -m "ci: merge dev → main (auto)"
          POST_SHA=$(git rev-parse HEAD)
          git push origin main
          echo "pre_sha=$PRE_SHA" >> "$GITHUB_OUTPUT"
          echo "post_sha=$POST_SHA" >> "$GITHUB_OUTPUT"

      - name: Trigger production deploy
        run: |
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger docs deploy if docs changed (e5810bf7)
        # docs.yml's own `push` trigger never fires for the push above: this
        # job pushes to main with the default GITHUB_TOKEN, and GitHub
        # suppresses push-triggered workflow runs caused by GITHUB_TOKEN
        # activity (anti-recursion). That silent gap is exactly why the
        # public docs site went stale for weeks after 2026-07-26 (audit note
        # e5810bf7) even though docs source kept merging cleanly to main.
        # workflow_dispatch is explicitly EXEMPTED from that suppression —
        # the same mechanism "Trigger production deploy" above already
        # relies on to re-fire this very workflow — so an explicit dispatch
        # here reliably reaches docs.yml. Gate on an actual docs-path diff
        # (mirrors docs.yml's own `paths:` filter, which push-vs-dispatch
        # bypasses) so an unrelated promote doesn't force a redundant
        # rebuild+redeploy. Pass the exact merged SHA so docs.yml builds
        # that precise commit rather than "whatever main is" when the
        # dispatched run actually starts.
        run: |
          if git diff --name-only "${{ steps.merge.outputs.pre_sha }}" "${{ steps.merge.outputs.post_sha }}" -- docs mkdocs.yml .github/workflows/docs.yml | grep -q .; then
            echo "Docs-relevant paths changed — dispatching docs deploy for ${{ steps.merge.outputs.post_sha }}"
            gh workflow run docs.yml --ref main -f sha="${{ steps.merge.outputs.post_sha }}"
          else
            echo "No docs-relevant paths changed in this promote — skipping docs deploy dispatch"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 4a. AUTO-PROMOTE dev → main on green CI (427b7902) ────────────────────
  # Fires on the `workflow_run` completion of test.yml ("Test (dev branch)").
  # Promotes ONLY when that CI run concluded `success` on the `dev` branch — no
  # operator `promote=yes` dispatch needed for the routine green path. This is the
  # exact same merge + trigger as `merge-to-main`, driven by green CI instead of a
  # manual dispatch. It merges the SPECIFIC commit that passed CI
  # (`workflow_run.head_sha`) — never a newer, untested dev tip.
  #
  # Loop-safety (respects the existing GITHUB_TOKEN anti-recursion design):
  #   * The merge pushes to `main` with the default GITHUB_TOKEN. GitHub does NOT
  #     trigger new workflow runs from GITHUB_TOKEN pushes, so this push cannot
  #     re-fire test.yml (which triggers on push-to-dev anyway, not main) or this
  #     workflow. No recursion.
  #   * Prod is deployed by an explicit `gh workflow run deploy.yml --ref main`
  #     dispatch (workflow_dispatch DOES fire under GITHUB_TOKEN) — the identical
  #     mechanism the operator-gated promote uses. The dev-ref auto-promote run
  #     NEVER self-deploys prod: the `deploy` job's `if` only deploys on a main-ref
  #     push/dispatch, hotfix, or tag — a `workflow_run` event matches none of
  #     those. Exactly ONE prod deploy per promote: the main-ref dispatch.
  auto-promote:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge the CI-green dev commit into main
        id: merge
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          # Merge the EXACT commit that passed CI, not a floating origin/dev tip
          # that may have advanced to an untested commit since CI started.
          GREEN_SHA="${{ github.event.workflow_run.head_sha }}"
          echo "Promoting CI-green dev commit $GREEN_SHA -> main"
          git checkout main
          PRE_SHA=$(git rev-parse HEAD)
          # Idempotent: if main already contains this commit (e.g. a re-run of the
          # same workflow_run), the merge is a no-op and we skip the push.
          if git merge-base --is-ancestor "$GREEN_SHA" HEAD; then
            echo "main already contains $GREEN_SHA — nothing to promote."
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "post_sha=$PRE_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git merge --no-ff --no-edit "$GREEN_SHA" -m "ci: merge dev → main (auto-promote on green CI)"
          POST_SHA=$(git rev-parse HEAD)
          git push origin main
          echo "merged=true" >> "$GITHUB_OUTPUT"
          echo "pre_sha=$PRE_SHA" >> "$GITHUB_OUTPUT"
          echo "post_sha=$POST_SHA" >> "$GITHUB_OUTPUT"
      - name: Trigger production deploy
        run: |
          # Dispatch the main-ref deploy that actually rolls prod (same mechanism
          # as the operator-gated promote). If the merge step above short-circuited
          # because main already had the commit, a redundant main-ref deploy of the
          # same SHA is harmless — a canary redeploy of identical code.
          gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger docs deploy if docs changed (e5810bf7)
        # Same anti-recursion gap as merge-to-main's identically-named step
        # above: this job's push to main also uses GITHUB_TOKEN, so
        # docs.yml's `push` trigger never fires here either — and since
        # auto-promote (not the manual promote=yes dispatch) is the routine,
        # everyday green path, this was the actual live cause of docs going
        # stale after 2026-07-26 (audit note e5810bf7). Skip entirely when
        # the merge step short-circuited (nothing new landed on main, so
        # nothing new to publish). Otherwise gate on a real docs-path diff
        # and pin the exact merged SHA, same as merge-to-main.
        if: steps.merge.outputs.merged == 'true'
        run: |
          if git diff --name-only "${{ steps.merge.outputs.pre_sha }}" "${{ steps.merge.outputs.post_sha }}" -- docs mkdocs.yml .github/workflows/docs.yml | grep -q .; then
            echo "Docs-relevant paths changed — dispatching docs deploy for ${{ steps.merge.outputs.post_sha }}"
            gh workflow run docs.yml --ref main -f sha="${{ steps.merge.outputs.post_sha }}"
          else
            echo "No docs-relevant paths changed in this promote — skipping docs deploy dispatch"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── 5. Production deploy ─────────────────────────────────────────────────
  deploy:
    needs: [test, merge-to-main]
    # NOTE (priority_zero fix): the deploy job used to additionally require
    # `github.actor == 'github-actions[bot]'` on a main push. That silently SKIPPED
    # this job on any direct/human push to main while the workflow still reported
    # "success" — so a green deploy.yml run did NOT mean prod was redeployed (prod sat
    # ~19h stale, confirmed via `fly releases`). The actor gate is dropped: any push to
    # main deploys, still fully gated on the test job passing. The promote=yes dispatch
    # remains the preferred path (it adds preview + smoke first), but a direct main push
    # can no longer masquerade as a successful deploy.
    #
    # NOTE (9a7972a9 exactly-once fix): the workflow_dispatch term below used to be
    # UNGUARDED by ref. On a `promote=yes` dispatch (which runs on the `dev` ref), that
    # made THIS job deploy prod from the dev checkout — while `merge-to-main` ALSO fired
    # a separate `gh workflow run deploy.yml --ref main` dispatch whose own deploy job ran
    # too. Result: a single promote produced TWO prod deploys (a bogus dev-ref one + the
    # real main-ref one). The promote (dev-ref) run's ONLY job is to merge dev→main and
    # trigger the main-ref run; it must NOT self-deploy prod. So a workflow_dispatch now
    # only deploys prod when it is on `main` (the run merge-to-main triggers) OR it is an
    # emergency `hotfix=yes` straight-to-prod dispatch. This leaves exactly one prod deploy
    # per promote: the main-ref dispatch. (Direct main push and tag pushes are unchanged.)
    if: >
      always() &&
      (needs.test.result == 'success' || needs.test.result == 'skipped') &&
      (needs.merge-to-main.result == 'success' || needs.merge-to-main.result == 'skipped') &&
      ((github.ref == 'refs/heads/main' &&
        github.event_name == 'push') ||
       (github.event_name == 'workflow_dispatch' &&
        (github.ref == 'refs/heads/main' || inputs.hotfix == 'yes')) ||
       startsWith(github.ref, 'refs/tags/v'))
      && github.ref != 'refs/heads/codex/repair-origin-cert'
    runs-on: ubuntu-latest
    outputs:
      deployed_version: ${{ steps.deploy.outputs.deployed_version }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Record pre-deploy image
        id: pre_deploy
        run: |
          # flyctl image show --json returns a LIST of machine image records with
          # NO Ref key — the keys are Registry/Repository/Tag/Digest. Build the
          # image ref ourselves (digest-pinned for an immutable rollback target,
          # tag as fallback). The old Ref/ref/Reference parse always yielded '' so
          # rollback could never fire (observed on the 2026-07-04 promote).
          IMAGE=$(flyctl image show --app meridian-hosted --json 2>/dev/null | python3 -c "import sys,json; raw=sys.stdin.read().strip(); d=json.loads(raw) if raw else []; m=(d[0] if isinstance(d,list) and d else (d if isinstance(d,dict) else {})); reg=m.get('Registry',''); repo=m.get('Repository',''); tag=m.get('Tag',''); dig=m.get('Digest',''); print((reg+'/'+repo+'@'+dig) if (reg and repo and dig) else ((reg+'/'+repo+':'+tag) if (reg and repo and tag) else ''))" 2>/dev/null || echo "")
          echo "Pre-deploy image: ${IMAGE:-<none>}"
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy to production (canary)
        id: deploy
        run: |
          flyctl deploy --remote-only --config fly.toml --strategy=canary --build-arg MERIDIAN_GIT_SHA=$(git rev-parse --short=12 HEAD)
          echo "deployed_version=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Post-deploy smoke test
        id: smoke
        run: |
          if [ "${{ inputs.hotfix }}" = "yes" ]; then sleep 5; else sleep 10; fi
          # Hit the Fly ORIGIN, not the Cloudflare-fronted usemeridian.us: the
          # edge 403s GitHub Actions runner IPs (bot rule), which caused a false
          # rollback trigger on the 2026-07-04 promote even though prod was healthy
          # (the preview smoke already hits *.fly.dev for this same reason). Retry
          # so a brief canary-rotation blip doesn't fail the deploy.
          STATUS=000
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://meridian-hosted.fly.dev/health || echo 000)
            echo "Attempt $i: /health = $STATUS"
            [ "$STATUS" = "200" ] && break
            sleep 10
          done
          [ "$STATUS" = "200" ] || (echo "FAIL: prod /health returned $STATUS after 6 attempts" && exit 1)
        continue-on-error: true

      - name: Rollback on smoke failure
        if: steps.smoke.outcome == 'failure'
        run: |
          echo "Smoke test failed — rolling back to previous image"
          PREV="${{ steps.pre_deploy.outputs.image }}"
          if [ -n "$PREV" ]; then
            flyctl deploy --image "$PREV" --app meridian-hosted --strategy=immediate
          else
            echo "No previous image recorded — manual rollback required"
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Fail job if smoke test failed (after rollback attempt)
        if: steps.smoke.outcome == 'failure'
        run: exit 1

  # One-off incident path used from the isolated repair branch. It reconciles
  # Fly's custom-domain certificate without deploying that branch's image.
  repair-origin-cert:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/repair-origin-cert' && inputs.hotfix == 'yes'
    runs-on: ubuntu-latest
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Reconcile Fly certificate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -u
          flyctl certs check usemeridian.us --app meridian-hosted --json || true
          flyctl certs setup usemeridian.us --app meridian-hosted --json || true
          # The existing ACME record is expired and fly certs add is
          # idempotent, so remove only the stale ACME issuance before
          # requesting a fresh certificate. Custom certificates, if any,
          # are left untouched.
          flyctl certs remove usemeridian.us --app meridian-hosted --acme --yes || true
          flyctl certs add usemeridian.us --app meridian-hosted --json
          flyctl certs check usemeridian.us --app meridian-hosted --json || true
      - name: Verify public health after certificate reconciliation
        shell: bash
        run: |
          set -u
          for attempt in $(seq 1 18); do
            status=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 15 https://usemeridian.us/health || true)
            echo "Attempt ${attempt}: https://usemeridian.us/health = ${status}"
            if [ "$status" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 10
          done
          exit 1

  # ─── 5a. Ensure prod runs in both regions (HA) ────────────────────────────
  # Spread prod machines across iad (primary) + ord (Chicago) so a single
  # region outage can't take prod down. Idempotent — `scale count` just sets
  # desired state. Non-fatal: a scaling hiccup must not fail the deploy, and
  # idle machines auto-stop so the second region adds little steady-state cost.
  #
  # 4da86be7 — this job's `if` previously required `github.event_name == 'push'`,
  # but the REAL prod-deploy trigger under normal operation is `workflow_dispatch`
  # (fired automatically by the dev->main auto-promote path; see the workflow_run
  # trigger + auto-promote job above). A direct `push` to main only happens on
  # rare manual/incident occasions. Confirmed live: `flyctl regions list -a
  # meridian-hosted` showed ONLY `iad` (zero `ord` machines) despite this job
  # existing, and `gh run list` history showed ensure-regions skipped (0s) on
  # every recent workflow_dispatch-triggered deploy. So under real, everyday
  # operation this job never actually ran, and the intended iad+ord spread was
  # never applied.
  #
  # First widening attempt (github.event_name == 'push' || == 'workflow_dispatch',
  # no status function) STILL skipped on the very next workflow_dispatch deploy
  # despite `deploy` reporting a clean success — confirmed live via the Jobs API
  # (conclusion: skipped) even though this exact `if` text was present on the
  # commit the run actually checked out (head_sha verified). Rather than keep
  # guessing at why the implicit success()-ANDing didn't take effect as
  # expected, this now explicitly spells out `always()` + `needs.deploy.result`,
  # mirroring the `deploy` job's OWN condition shape immediately above (which
  # demonstrably works reliably under workflow_dispatch) instead of relying on
  # an implicit, less-observable status check.
  ensure-regions:
    needs: deploy
    if: >
      always() &&
      needs.deploy.result == 'success' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # 4da86be7 -- `flyctl scale count 2 --region iad,ord` (a single combined
      # invocation) does NOT force redistribution when the app is already
      # concentrated in one region: confirmed live that with 7 existing iad
      # machines, this computed "iad: -5 (7->2), ord: untouched" -- it only
      # trims the existing region down to the target total, never creating a
      # machine in a region that had zero presence, because no NEW machine
      # creation was needed to satisfy the count. `fly regions add` (the more
      # obvious fix) is no longer supported for Machines-platform apps ("use
      # fly scale count" is the error message) -- confirmed live. What DOES
      # work, confirmed live: scoping each region to its OWN `scale count`
      # call forces real placement (`+1 machines ... region 'ord'`, an actual
      # machine created) instead of a combined, ambiguous multi-region count.
      - name: Ensure 1 machine in ord (secondary region)
        run: flyctl scale count 1 --region ord --app meridian-hosted --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Ensure 1 machine in iad (primary region)
        run: flyctl scale count 1 --region iad --app meridian-hosted --yes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

  # ─── 5b. (removed) Refresh preview to latest main ─────────────────────────
  # cd9c2bf7 -- this job used to redeploy meridian-preview from `main` after
  # every prod deploy ("so preview never drifts behind main"). That is
  # backwards for a preview meant to be the "nightly" channel: `deploy-preview`
  # (job 2, above) already redeploys meridian-preview from the latest `dev`
  # commit on every dev push, which is the actual nightly behavior wanted.
  # This job fired right behind it on every auto-promote and overwrote that
  # dev deploy with the just-promoted main commit, so preview never actually
  # tracked dev for more than a few minutes at a time. See fly-preview.toml.

  # ─── 6. CHANGELOG ─────────────────────────────────────────────────────────
  changelog:
    needs: deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: latest
          cache: true
      - name: Generate CHANGELOG
        run: pixi run git-cliff --output CHANGELOG.md
      - name: Commit CHANGELOG.md if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet CHANGELOG.md; then
            git add CHANGELOG.md
            git commit -m "chore: update CHANGELOG"
            git push origin HEAD:main
          fi
