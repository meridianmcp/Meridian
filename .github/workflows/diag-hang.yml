name: DIAGNOSTIC - hang investigation (temporary, delete after use)

on:
  workflow_dispatch: {}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.9.3
        with:
          pixi-version: v0.79.0
          cache: true
      - run: pixi install
      - name: Run full suite verbose (no wrapper, no coverage) to see exactly which test hangs
        run: |
          pixi run python -m pytest tests/ -v -n 3 --dist=worksteal --tb=short \
            --ignore=tests/test_demo_ux.py --ignore=tests/test_rate_limit_serial.py \
            -m "not subprocess_isolated" --durations=25 --timeout=60 2>&1 | tee /tmp/diag.log
        timeout-minutes: 25
      - name: Always show tail of log even on timeout/failure
        if: always()
        run: tail -n 400 /tmp/diag.log || true
