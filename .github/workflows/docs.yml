name: Deploy Docs to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install MkDocs Material
        run: pip install mkdocs-material

      - name: Build and deploy docs
        run: |
          echo "docs.usemeridian.us" > docs/CNAME
          mkdocs gh-deploy --force --clean --verbose --remote-name https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/meridianmcp/meridian-docs.git
