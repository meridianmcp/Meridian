name: Windows full test run

# On-demand Windows run of the whole suite. The owner's dev machine is Windows, the canonical
# CI (test.yml) is Linux, and a few failures only show up on Windows (asyncio policy leaks into
# the Playwright tests, console-window behaviour, path handling). A laptop run of the full suite
# takes over an hour and exhausts memory on a loaded machine; a hosted runner does not.
#
# Not wired to dev pushes or to auto-promote (it takes 60+ minutes): trigger it by hand
# (Actions -> Windows full test run -> Run workflow, or `gh workflow run windows-tests.yml
# --ref <branch>`), or by pushing the branch `ci/windows-suite`.

on:
  workflow_dispatch:
    inputs:
      include_ux:
        description: 'Also run tests/test_demo_ux.py (Playwright) as a separate step'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']
  push:
    branches: [ci/windows-suite]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PYTHONDONTWRITEBYTECODE: 1
  PYTHONUTF8: 1

jobs:
  windows-suite:
    runs-on: windows-latest
    # The full suite took ~70 minutes on a 2-worker laptop run; leave room, but never hang forever.
    timeout-minutes: 150
    env:
      # windows-latest has 4 vCPUs; run_tests.py caps at 8 by default.
      MERIDIAN_TEST_MAX_WORKERS: '4'
      MERIDIAN_TEST_WALL_TIMEOUT_SECONDS: '7200'
    steps:
      # Mirror the developer machine, not the runner defaults. (1) Git for Windows' default
      # core.autocrlf=true rewrites every checked-out file to CRLF, which changes the bytes
      # and so the sha256/size the capability manifest and the dashboard bundle hash pin; the
      # dev checkout uses autocrlf=false. (2) `bash` on the runner PATH is the WSL launcher
      # stub ("no installed distributions"), not Git Bash, so every .sh hook test would fail
      # with UTF-16 noise; put Git's bash first, as it is on the dev machine.
      - name: Match the dev machine (no CRLF rewrite; Git Bash, not the WSL stub, answers to 'bash')
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          "C:/Program Files/Git/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # Putting Git first on PATH is not enough: CreateProcess (which subprocess uses for a
          # bare 'bash') searches System32 BEFORE PATH, and the runner image ships the WSL
          # launcher stub there (run 37719217133: 170 hook tests got 'no installed
          # distributions' in UTF-16). The dev machine has no such stub. Move it aside on this
          # throwaway VM so 'bash' resolves to Git Bash through PATH.
          $stub = Join-Path $env:SystemRoot 'System32ash.exe'
          if (Test-Path $stub) {
            try {
              takeown /f $stub | Out-Null
              icacls $stub /grant "$($env:USERNAME):F" | Out-Null
              Rename-Item -Path $stub -NewName 'bash.exe.wsl-stub' -ErrorAction Stop
              Write-Host "moved aside $stub"
            } catch { Write-Warning "could not move the WSL bash stub aside: $_" }
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.79.0
          cache: false
      - run: pixi install
      - name: Install Playwright Chromium
        run: pixi run python -m playwright install chromium
      # Same selection as the local `pixi run test` task, minus the Playwright file (own step below).
      - name: Full suite (xdist, then the serial and subprocess-isolated groups)
        shell: bash
        run: |
          set -o pipefail
          # --deselect: the owner-only-ACE assertion counts the ACEs on a temp file; the runner's temp
          # directory inherits an extra Administrators ACE that a normal user profile does not.
          pixi run python scripts/run_tests.py tests/ -q --tb=short -rfE --ignore=tests/test_demo_ux.py --ignore=tests/test_rate_limit_serial.py -m "not subprocess_isolated" --deselect tests/test_9784f8ef_install_token_exposure.py::test_curl_header_config_is_really_owner_only_on_windows
      - name: Rate-limit module (serial, wall-clock sensitive)
        if: always()
        run: pixi run python scripts/run_tests.py --serial tests/test_rate_limit_serial.py -q --tb=short -rfE
      - name: Subprocess-isolated tests (serial)
        if: always()
        run: pixi run python scripts/run_tests.py --serial tests/ -q --tb=short -rfE -m subprocess_isolated
      - name: Demo UX (Playwright)
        if: always() && inputs.include_ux != 'false'
        run: pixi run python -m pytest tests/test_demo_ux.py -q --tb=short -rfE -n 2
