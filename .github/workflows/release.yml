name: Build & Release Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - name: Build Windows executable
        run: pixi run build-exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-windows
          path: dist/meridian.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - name: Build Linux executable
        run: pixi run build-exe
      - name: Stage artifact
        run: cp dist/meridian dist/meridian-linux
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-linux
          path: dist/meridian-linux

  build-mac-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - name: Build macOS arm64 executable
        run: pixi run build-exe
      - name: Stage artifact
        run: cp dist/meridian dist/meridian-mac-arm64
      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-mac-arm64
          path: dist/meridian-mac-arm64

  build-mac-x86:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: false
      - name: Build macOS x86_64 executable
        run: pixi run build-exe
      - name: Stage artifact
        run: cp dist/meridian dist/meridian-mac-x86_64
      - name: Upload macOS x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-mac-x86_64
          path: dist/meridian-mac-x86_64

  release:
    needs: [build-windows, build-linux, build-mac-arm64, build-mac-x86]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/meridian-windows/meridian.exe
            dist-artifacts/meridian-linux/meridian-linux
            dist-artifacts/meridian-mac-arm64/meridian-mac-arm64
            dist-artifacts/meridian-mac-x86_64/meridian-mac-x86_64
          generate_release_notes: true
