name: Build & Release Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Build Windows executable
        run: pixi run build-exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-windows
          path: dist/meridian.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Build Linux executable
        run: pixi run build-exe
      - name: Stage artifact
        run: cp dist/meridian dist/meridian-linux
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-linux
          path: dist/meridian-linux

  build-mac-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Build macOS arm64 executable
        run: pixi run build-exe
      - name: Stage artifact
        run: cp dist/meridian dist/meridian-mac-arm64
      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-mac-arm64
          path: dist/meridian-mac-arm64

  build-mac-x86:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Build macOS x86_64 executable
        run: pixi run build-exe
      - name: Stage artifact
        run: cp dist/meridian dist/meridian-mac-x86_64
      - name: Upload macOS x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: meridian-mac-x86_64
          path: dist/meridian-mac-x86_64

  build-connect:
    strategy:
      matrix:
        include:
          - os: ubuntu-20.04
            artifact: meridian-connect-x86_64-unknown-linux
          - os: ubuntu-22.04-arm64
            artifact: meridian-connect-aarch64-unknown-linux
          - os: macos-14
            artifact: meridian-connect-aarch64-apple-darwin
          - os: macos-13
            artifact: meridian-connect-x86_64-apple-darwin
          - os: windows-latest
            artifact: meridian-connect-x86_64-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: Build meridian-connect
        run: pixi run build-connect
      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: mv dist/meridian-connect ${{ matrix.artifact }}
      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        run: mv dist/meridian-connect.exe ${{ matrix.artifact }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: [build-windows, build-linux, build-mac-arm64, build-mac-x86, build-connect]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-artifacts/meridian-windows/meridian.exe
            dist-artifacts/meridian-linux/meridian-linux
            dist-artifacts/meridian-mac-arm64/meridian-mac-arm64
            dist-artifacts/meridian-mac-x86_64/meridian-mac-x86_64
            dist-artifacts/meridian-connect-x86_64-unknown-linux/meridian-connect-x86_64-unknown-linux
            dist-artifacts/meridian-connect-aarch64-unknown-linux/meridian-connect-aarch64-unknown-linux
            dist-artifacts/meridian-connect-aarch64-apple-darwin/meridian-connect-aarch64-apple-darwin
            dist-artifacts/meridian-connect-x86_64-apple-darwin/meridian-connect-x86_64-apple-darwin
            dist-artifacts/meridian-connect-x86_64-windows.exe/meridian-connect-x86_64-windows.exe
          generate_release_notes: true

  docker-publish:
    needs: [build-windows, build-linux, build-mac-arm64, build-mac-x86]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            acamerer/meridian:latest
            acamerer/meridian:${{ github.ref_name }}

  docker-ghcr:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/meridianmcp/meridian:latest
            ghcr.io/meridianmcp/meridian:${{ github.ref_name }}

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - run: |
          TAG="${{ github.ref_name }}"
          cd npm && npm version "$TAG" --no-git-tag-version
          if [[ "$TAG" == *"-"* ]]; then
            npm publish --tag pre-alpha
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  mcp-registry-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Publish to MCP Registry
        run: npx -y mcp-publisher publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: latest
      - name: Build and publish to PyPI
        run: uv build && uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

