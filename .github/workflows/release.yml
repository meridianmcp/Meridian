name: Build & Release Binaries

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.79.0
          cache: true
      - name: Install UPX (binary compression)
        run: choco install upx -y --no-progress
      - name: Build Windows executable
        run: pixi run -e dev build-exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meridian-windows
          path: dist/meridian.exe

  # 4e4c3817 -- Windows tray/GUI installer (meridian-tray.exe). Wraps
  # LocalRunner (899936dd) to supervise the real HTTP server as a child
  # process; see meridian/tray_main.py's own module docstring. Originally
  # Windows-only per this item's initial scope; a macOS counterpart now
  # ships too (73257801, build-tray-mac below) via the same spec file's
  # darwin branch. Linux still has no tray build (separate item,
  # 52cdabaa -- a .desktop launcher, not this PyInstaller+pystray mechanism).
  build-tray:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.79.0
          cache: true
      - name: Install UPX (binary compression)
        run: choco install upx -y --no-progress
      - name: Build Windows tray executable
        run: pixi run -e dev build-tray
      - name: Upload tray artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meridian-tray-windows
          path: dist/meridian-tray.exe

  # macOS tray build (unsigned .app + drag-and-drop DMG). Same
  # PyInstaller+pystray mechanism as build-tray above (meridian/tray_main.py
  # has zero platform-specific code -- see meridian-tray.spec's own darwin
  # branch for where platform actually matters: hiddenimports and the
  # onedir+COLLECT+BUNDLE packaging pystray's macOS menu-bar icon needs).
  # macos-14 mirrors build-mac-arm64's runner choice -- only Apple Silicon is
  # realistic here (macos-13/Intel is effectively unavailable, same
  # constraint already accepted for the slim client per decision 80f1d4bc).
  # No UPX install step, matching build-mac-arm64's existing precedent for
  # this runner (pixi run -e dev build-tray still passes upx=True; PyInstaller
  # skips compression gracefully when the upx binary isn't on PATH). The
  # build-tray-mac task creates the ICNS asset from the shared Meridian mark.
  # Ships UNSIGNED / not notarized, matching build-tray's own Windows
  # precedent -- code signing/notarization is a deliberate, separate follow-up
  # (see meridian-tray.spec's module docstring for the macOS Gatekeeper
  # caveat this implies).
  build-tray-mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.79.0
          cache: true
      - name: Build macOS tray app bundle
        run: pixi run -e dev build-tray-mac
      - name: Zip app bundle
        id: zip_app
        # ditto (not a plain `zip`) preserves the .app bundle's resource
        # forks/extended attributes correctly -- Apple's own documented tool
        # for this, matching how Finder's own "Compress" does it.
        run: ditto -c -k --sequesterRsrc --keepParent dist/meridian-tray.app meridian-tray-mac.zip
      - name: Create drag-and-drop DMG
        run: |
          mkdir -p dist/meridian-tray-dmg
          ditto dist/meridian-tray.app dist/meridian-tray-dmg/Meridian.app
          ln -s /Applications dist/meridian-tray-dmg/Applications
          hdiutil create -volname Meridian -srcfolder dist/meridian-tray-dmg -ov -format UDZO meridian-tray-mac.dmg
      # DMG packaging is optional: preserve the ZIP if hdiutil fails afterward.
      - name: Upload tray artifact
        if: ${{ always() && steps.zip_app.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meridian-tray-mac
          path: |
            meridian-tray-mac.zip
            meridian-tray-mac.dmg

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.79.0
          cache: true
      - name: Install UPX (binary compression)
        run: sudo apt-get update && sudo apt-get install -y upx-ucl
      - name: Build Linux executable
        run: pixi run -e dev build-exe
      - name: Stage artifact
        run: cp dist/meridian dist/meridian-linux
      - name: Upload Linux artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meridian-linux
          path: dist/meridian-linux

  build-mac-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.79.0
          cache: true
      - name: Build macOS arm64 executable
        run: pixi run -e dev build-exe
      - name: Stage artifact
        run: cp dist/meridian dist/meridian-mac-arm64
      - name: Upload macOS arm64 artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meridian-mac-arm64
          path: dist/meridian-mac-arm64

  # 80f1d4bc — macOS x86_64 (Intel) builds are dropped. The macos-13 runner is
  # effectively unavailable to this repo (its jobs queued 34+ min and never ran
  # on the v0.1.7 tag), so *requiring* it blocked the entire GitHub release. Apple
  # Silicon still ships (build-mac-arm64 / the aarch64-apple-darwin connect
  # variant). Restore an x86-mac job if GitHub provides a working Intel runner.

  build-connect:
    strategy:
      # 80f1d4bc — a failing platform must not cancel the others.
      fail-fast: false
      matrix:
        include:
          # Runner history: ubuntu-20.04 was retired by GitHub (queued forever).
          # 80f1d4bc — two more platforms dropped as unbuildable here:
          #  - macos-13 (x86_64 Intel): runner effectively unavailable (queued 34m+).
          #  - ubuntu-22.04-arm (linux-aarch64): pixi's workspace doesn't declare
          #    that platform (`pixi install` -> unsupported-platform), so the build
          #    errors. Re-add after `pixi workspace platform add linux-aarch64` +
          #    a lock re-solve.
          - os: ubuntu-22.04
            artifact: meridian-connect-x86_64-unknown-linux
          - os: macos-14
            artifact: meridian-connect-aarch64-apple-darwin
          - os: windows-latest
            artifact: meridian-connect-x86_64-windows.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: prefix-dev/setup-pixi@ba3bb36eb2066252b2363392b7739741bb777659 # v0.8.1
        with:
          pixi-version: v0.79.0
          cache: true
      - name: Build meridian-connect
        run: pixi run -e dev build-connect
      - name: Stage artifact (Unix)
        if: runner.os != 'Windows'
        run: mv dist/meridian-connect ${{ matrix.artifact }}
      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        run: mv dist/meridian-connect.exe ${{ matrix.artifact }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    needs: [build-windows, build-tray, build-tray-mac, build-linux, build-mac-arm64, build-connect]
    # 80f1d4bc — run as long as we weren't cancelled, even if a build variant
    # failed, so one flaky/unbuildable platform can't SKIP the whole release.
    # With fail_on_unmatched_files:false the release ships whatever actually built.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist-artifacts
      # f66e8f23 — publish SHA-256 checksums for every binary this release ships.
      # install.sh / install.ps1 / scripts/install-windows.ps1 download SHA256SUMS
      # from the same release and refuse to install or run a binary whose hash is
      # not listed (they fail closed). The hashes are computed here over the exact
      # files that are uploaded below, in `sha256sum` format ("<hex>  <basename>"),
      # so `sha256sum -c SHA256SUMS` also works for a manual download. The asset
      # list below MUST stay in sync with the `files:` list of the next step
      # (tests/test_f66e8f23_download_integrity.py pins this). A platform that did
      # not build is skipped, mirroring fail_on_unmatched_files: false.
      # NOTE: this proves the bytes match what the release workflow produced; it
      # does not authenticate the workflow itself -- detached signing of the
      # release assets is a separate follow-up.
      - name: Generate SHA256SUMS for every release binary
        run: |
          set -euo pipefail
          mkdir -p release-assets
          : > release-assets/SHA256SUMS
          for f in \
            dist-artifacts/meridian-windows/meridian.exe \
            dist-artifacts/meridian-tray-windows/meridian-tray.exe \
            dist-artifacts/meridian-tray-mac/meridian-tray-mac.zip \
            dist-artifacts/meridian-tray-mac/meridian-tray-mac.dmg \
            dist-artifacts/meridian-linux/meridian-linux \
            dist-artifacts/meridian-mac-arm64/meridian-mac-arm64 \
            dist-artifacts/meridian-connect-x86_64-unknown-linux/meridian-connect-x86_64-unknown-linux \
            dist-artifacts/meridian-connect-aarch64-apple-darwin/meridian-connect-aarch64-apple-darwin \
            dist-artifacts/meridian-connect-x86_64-windows.exe/meridian-connect-x86_64-windows.exe
          do
            if [ -f "$f" ]; then
              (cd "$(dirname "$f")" && sha256sum "$(basename "$f")") >> release-assets/SHA256SUMS
            else
              echo "::warning::not checksummed (artifact missing, will not be released): $f"
            fi
          done
          if [ ! -s release-assets/SHA256SUMS ]; then
            echo "::error::no release binaries were found to checksum"
            exit 1
          fi
          cat release-assets/SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # 80f1d4bc — ship whatever built; a missing platform artifact (transient
          # runner outage) must not fail the whole release. macos-x86 is no longer
          # produced (dead runner).
          fail_on_unmatched_files: false
          files: |
            dist-artifacts/meridian-windows/meridian.exe
            dist-artifacts/meridian-tray-windows/meridian-tray.exe
            dist-artifacts/meridian-tray-mac/meridian-tray-mac.zip
            dist-artifacts/meridian-tray-mac/meridian-tray-mac.dmg
            dist-artifacts/meridian-linux/meridian-linux
            dist-artifacts/meridian-mac-arm64/meridian-mac-arm64
            dist-artifacts/meridian-connect-x86_64-unknown-linux/meridian-connect-x86_64-unknown-linux
            dist-artifacts/meridian-connect-aarch64-apple-darwin/meridian-connect-aarch64-apple-darwin
            dist-artifacts/meridian-connect-x86_64-windows.exe/meridian-connect-x86_64-windows.exe
            release-assets/SHA256SUMS
          generate_release_notes: true

  docker-publish:
    needs: [build-windows, build-linux, build-mac-arm64]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # 80f1d4bc — skip Docker Hub publish cleanly when creds aren't configured
      # (repo without DOCKER_USERNAME/DOCKER_TOKEN) instead of failing the run.
      # The ghcr image (docker-ghcr, via GITHUB_TOKEN) still publishes regardless.
      # 730b7d8e — the guard only checked DOCKER_USERNAME; a repo with just ONE
      # of the two secrets configured (confirmed live on the v0.1.8 tag run,
      # 28740098906: "Log in to Docker Hub" failed with "Username and password
      # required" even though this check reported has=true) still hit a real
      # failure instead of skipping cleanly. Require BOTH secrets.
      - name: Check Docker Hub credentials
        id: dockercreds
        run: echo "has=${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - name: Log in to Docker Hub
        if: steps.dockercreds.outputs.has == 'true'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and push Docker image
        if: steps.dockercreds.outputs.has == 'true'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: |
            acamerer/meridian:latest
            acamerer/meridian:${{ github.ref_name }}

  docker-ghcr:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/meridianmcp/meridian:latest
            ghcr.io/meridianmcp/meridian:${{ github.ref_name }}

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # '22', not '20': @meridianmcp/mcp now bundles the meridian-latex
          # engine in as a real subpath (npm/scripts/bundle-latex.mjs, run
          # automatically as this package's own prepack step), which
          # depends on better-sqlite3@13 -- its own package.json requires
          # node >=22 (confirmed directly). Node 20 only warned
          # (EBADENGINE) rather than failing, so this was easy to miss.
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      # 730b7d8e — npm forbids republishing an already-published version
      # (confirmed live: v0.1.9 tag run 28767217852 failed with real error
      # "403 Forbidden ... You cannot publish over the previously published
      # versions: 0.1.9"), so re-running/re-triggering a workflow on a tag
      # whose npm version was already published failed the whole run even
      # though nothing was actually broken. Check the registry first and
      # skip cleanly — same tolerant "don't fail the run" pattern already
      # used for the Docker Hub credentials check above — instead of erroring.
      - name: Publish to npm (skip cleanly if this version is already published)
        run: |
          TAG="${{ github.ref_name }}"
          cd npm
          npm version "$TAG" --no-git-tag-version
          PKG_NAME=$(node -p "require('./package.json').name")
          if npm view "${PKG_NAME}@${TAG}" version >/dev/null 2>&1; then
            echo "${PKG_NAME}@${TAG} is already published on npm -- skipping (idempotent re-run)."
            exit 0
          fi
          if [[ "$TAG" == *"-"* ]]; then
            npm publish --tag pre-alpha
          else
            npm publish
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  mcp-registry-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Publish to MCP Registry
        run: npx -y mcp-publisher publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pypi-publish:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: latest
      - name: Build and publish to PyPI
        run: uv build && uv publish
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}

