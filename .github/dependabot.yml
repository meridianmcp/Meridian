# Dependabot version updates.
#
# This repo's flow is "work on dev, never push to main", so EVERY entry sets
# `target-branch: dev`; Dependabot PRs land on dev and ride the normal
# dev -> main promotion. Minor and patch bumps are grouped into one PR per
# ecosystem/directory to keep review load low; major bumps stay individual.
#
# Dependabot does not read pixi.toml. The `pip` entry covers the root
# pyproject.toml only; the extensions/ and packages/ pyproject.toml files are
# not listed here yet.
version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      pip-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      docker-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # One npm entry per directory that contains a package.json.
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-root-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/npm"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-wrapper-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/extensions/meridian-latex/engine"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-latex-engine-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
