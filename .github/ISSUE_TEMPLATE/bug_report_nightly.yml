# 7c82f7c8 — channel labeling for auto-filed GitHub issues (fdaa5b55).
#
# This template is the NIGHTLY-channel bug report: picking it (over
# "Bug Report (Stable)") is how the reporter applies the channel:nightly
# label — via which template they choose, not manual tagging. See
# bug_report.yml for the stable-channel twin.
#
# NOTE: the nightly deploy channel itself is not live yet (cd9c2bf7). This
# template exists so the labeling mechanism is ready once it lands — until
# then, prefer "Bug Report (Stable)" unless you are specifically running a
# nightly/pre-release build.
name: Bug Report (Nightly Build)
description: Something isn't working on a nightly / pre-release build
labels: ["bug", "channel:nightly"]
body:
  - type: markdown
    attributes:
      value: |
        Filing against a **nightly** build. If the same bug is later
        confirmed on the stable release too, a maintainer will mark it
        `channel:graduated` — the signal it needs a real fix before
        general release rather than being expected nightly-only noise.

  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP Client
      options:
        - Claude Code
        - Claude Desktop
        - Cursor
        - Windsurf
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Meridian Version
      placeholder: "e.g. 1.0.0-alpha or commit hash (nightly build tag if known)"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run `pixi run start`
        2. Call start_session(...)
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      render: shell
