[workspace]
name = "meridian"
version = "0.1.0-pre-alpha"
description = "Multi-session Claude coordinator MCP server"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.11,<3.13"
fastapi = ">=0.115"
uvicorn = ">=0.30"
aiosqlite = ">=0.20"
pydantic = ">=2.0,<3"
jinja2 = ">=3.1"
httpx = ">=0.27"
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-xdist = ">=3.5"
pytest-cov = ">=4.0"
# 343cb26d — per-test wall-clock kill so a single hung test (lingering asyncio
# loop / subprocess) can't keep the CI job alive indefinitely. Used via
# --timeout=60 in the test tasks below + the test.yml workflow.
pytest-timeout = ">=2.1"
beautifulsoup4 = ">=4.12"
git-cliff = ">=2.13.1,<3"

[pypi-dependencies]
# d45c2cc8 — detachable doc-intelligence sub-package (docs_intel + latex_intel).
# Editable path install so `import docparse` resolves for the app + test suite while
# the code lives standalone in packages/docparse/ (pip install -e ./packages/docparse).
meridian-docparse = { path = "packages/docparse", editable = true }
mcp = ">=1.0"
anthropic = ">=0.40"
python-dotenv = ">=1.0"
psycopg = {version = ">=3.1", extras = ["binary"]}
psycopg-pool = ">=3.2"
websockets = ">=12.0"
watchfiles = ">=0.21"
authlib = ">=1.3"
itsdangerous = ">=2.1"
resend = ">=0.7"
bcrypt = ">=4.0"
slowapi = ">=0.1"
playwright = ">=1.40"
# Tree-sitter core + grammars — foundation for symbol-level parallel protection
# (sprint 4bac57ff). Python uses stdlib `ast`; these cover the other languages.
tree-sitter = ">=0.21"
tree-sitter-python = ">=0.21"
tree-sitter-javascript = ">=0.21"
tree-sitter-typescript = ">=0.21"
tree-sitter-c = ">=0.21"
tree-sitter-cpp = ">=0.21"
tree-sitter-go = ">=0.21"
tree-sitter-rust = ">=0.21"
tree-sitter-java = ">=0.21"
tree-sitter-c-sharp = ">=0.21"
pylatexenc = ">=2.10, <3"

# Dev/build-only deps — not installed on Fly (Dockerfile uses pyproject.toml via uv).
# Use `pixi run -e dev <task>` for docs, exe builds, and media scripts.
[feature.dev.dependencies]
ffmpeg = ">=8.1.1,<9"

[feature.dev.pypi-dependencies]
ruff = ">=0.4"
pyinstaller = ">=6.0"
mkdocs-material = ">=9.5"
imageio = { version = ">=2.37.3, <3", extras = ["ffmpeg"] }
soundfile = ">=0.13.1, <0.14"
google-api-python-client = ">=2.197.0, <3"
google-auth-oauthlib = ">=1.4.0, <2"
fpdf2 = ">=2.7"

[environments]
dev = { features = ["dev"], solve-group = "default" }

[tasks]
start = { cmd = "python -m meridian", env = { MERIDIAN_CLAUDE_CLI = "cmd /c C:/Users/13144/AppData/Roaming/npm/claude.cmd -p" } }
dev = "uvicorn meridian.server:app --reload --port 7878"
test = "pytest tests/ -n auto -q --tb=short --ignore=tests/test_demo_ux.py --timeout=60"
# KEYSTONE 98aa7eb7 — run the SAME suite against real Postgres. The `db`/`client`
# fixtures (tests/conftest.py) route to Postgres whenever TEST_DATABASE_URL is set,
# so bugs SQLite :memory: hides (e.g. b7f41c73 datetime serialization) surface.
# Set the URL first, e.g.:
#   TEST_DATABASE_URL=postgresql://meridian:meridian@localhost:5432/meridian_test pixi run test-pg
# Mirrors the CI `test-postgres` job in .github/workflows/test.yml.
test-pg = "pytest tests/ -n auto -q --tb=short --ignore=tests/test_demo_ux.py --timeout=60"
test-cov = "pytest tests/ -n auto -q --tb=short --ignore=tests/test_demo_ux.py --timeout=60 --cov=meridian --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=80"
test-fast = "pytest tests/test_core.py tests/test_new_v25.py tests/test_hosted.py tests/test_github.py tests/test_milestones.py tests/test_md_anchors.py tests/test_security.py tests/test_ui.py tests/test_executor_runs.py tests/test_error_alerting.py tests/test_v2_hosted.py -n auto -q --tb=short"
build-exe = "pyinstaller meridian.spec --clean"
build-connect = "pyinstaller meridian-connect.spec --clean"
smoke-bundle = "node scripts/smoke_bundle.mjs"
demo = "python scripts/demo.py"
test-mcp = "python scripts/test_mcp.py"
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"
lint = "ruff check ."
changelog = "git-cliff --output CHANGELOG.md"
generate-files = "python scripts/generate_repo_files.py"
smoke-test-preview = "python scripts/smoke_test.py --url https://meridian-preview.fly.dev"
smoke-test-local = "python scripts/smoke_test.py --url http://localhost:7878"
funnel-smoke = "python scripts/funnel_smoke.py --url https://usemeridian.us"
test-live = "python scripts/test_live.py --skip-neon"
test-live-full = "python scripts/test_live.py"
test-auth = "python scripts/test_auth_flow.py"
test-waitlist = "python scripts/test_waitlist_db.py"
test-hooks = "python scripts/test_hooks_live.py --skip-live"
test-hooks-live = "python scripts/test_hooks_live.py"
# d188b408 — k6 load smoke tests (needs the k6 binary + a live target; never run
# against prod). Override the target: BASE_URL=https://... pixi run load-k6-signup
load-k6-signup = "k6 run k6/signup_smoke.js"
load-k6-mcp = "k6 run k6/mcp_tools.js"
test-mcp-tools = "python scripts/test_mcp_tools.py"
test-tenancy = "python scripts/test_tenancy.py"
launch = "python scripts/launch_morning.py"
starter = "python scripts/starter_handoff.py"
install-companions = "npm install -g repomix && pixi run install-browsers && echo Companions installed"
install-browsers = "playwright install chromium"
mcp = "python -m meridian --mcp"
executor = "python scripts/run_executor.py"
text-editor-mcp = { cmd = "pixi run python -m mcp_text_editor", cwd = "extensions/mcp-text-editor" }
repomix-mcp = "npx repomix --mcp"
