[workspace]
name = "meridian"
version = "1.0.0-alpha"
description = "Multi-session Claude coordinator MCP server"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.11,<3.13"
fastapi = ">=0.115"
uvicorn = ">=0.30"
aiosqlite = ">=0.20"
pydantic = ">=2.0,<3"
jinja2 = ">=3.1"
httpx = ">=0.27"
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
beautifulsoup4 = ">=4.12"
git-cliff = ">=2.13.1,<3"

[pypi-dependencies]
mcp = ">=1.0"
anthropic = ">=0.40"
python-dotenv = ">=1.0"
psycopg = {version = ">=3.1", extras = ["binary"]}
psycopg-pool = ">=3.2"
websockets = ">=12.0"
watchfiles = ">=0.21"
fpdf2 = ">=2.7"
pyinstaller = ">=6.0"
authlib = ">=1.3"
itsdangerous = ">=2.1"
resend = ">=0.7"
bcrypt = ">=4.0"
slowapi = ">=0.1"
mkdocs-material = ">=9.5"
playwright = ">=1.40"

[tasks]
start = { cmd = "python -m meridian", env = { MERIDIAN_CLAUDE_CLI = "cmd /c C:/Users/13144/AppData/Roaming/npm/claude.cmd -p" } }
dev = "uvicorn meridian.server:app --reload --port 7878"
test = "pytest tests/ -v"
build-exe = "pyinstaller meridian.spec --clean"
demo = "python scripts/demo.py"
test-mcp = "python scripts/test_mcp.py"
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"
changelog = "git-cliff --output CHANGELOG.md"
smoke-test-preview = "python scripts/smoke_test.py --url https://meridian-preview.fly.dev"
smoke-test-local = "python scripts/smoke_test.py --url http://localhost:7878"
test-live = "python scripts/test_live.py --skip-neon"
test-live-full = "python scripts/test_live.py"
test-auth = "python scripts/test_auth_flow.py"
test-waitlist = "python scripts/test_waitlist_db.py"
test-hooks = "python scripts/test_hooks_live.py --skip-live"
test-hooks-live = "python scripts/test_hooks_live.py"
test-mcp-tools = "python scripts/test_mcp_tools.py"
test-tenancy = "python scripts/test_tenancy.py"
launch = "python scripts/launch_morning.py"
install-companions = "npm install -g repomix && pixi run install-browsers && echo Companions installed"
install-browsers = "playwright install chromium"
mcp = "python -m meridian --mcp"
text-editor-mcp = { cmd = "pixi run python -m mcp_text_editor", cwd = "extensions/mcp-text-editor" }
repomix-mcp = "npx repomix --mcp"
