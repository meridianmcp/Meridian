# 15610335 — Pixi environments live OUTSIDE this repo's git worktrees.
#
# Every `.claude/worktrees/<session>` checkout otherwise gets its own ~1GB
# `.pixi/` environment duplicated inside the git-tracked tree (confirmed:
# 115.6 GB total across this repo's worktrees on 2026-08-04). Fix is Pixi's
# own `detached-environments` setting — but it is NOT a pixi.toml manifest
# key (confirmed live, pixi 0.67.0: adding `detached-environments = true` or
# a path string under `[workspace]` here silently no-ops — `pixi info --json`
# comes back with `project_info: null`, exit 0, no error). It only exists as
# a Pixi CONFIG key, set at the machine/user level:
#
#   pixi config set --global detached-environments true
#   # or an explicit external path, e.g.:
#   pixi config set --global detached-environments "C:/Users/<you>/.pixi/workspace-envs"
#
# which Meridian wraps in `meridian.pixi_env_retention.ensure_detached_environments_configured`
# (`python -m meridian.pixi_env_retention --configure`) so it's one command,
# not a thing to remember per machine. This is deliberately NOT baked into
# this shared, cross-platform pixi.toml — a hard-coded Windows path here
# would silently no-op (or point at the wrong place) on Linux CI runners and
# every other contributor's machine.
#
# GOTCHA (document, don't just fix): each worktree's `pixi.toml` lives at a
# DIFFERENT path, so even though every worktree shares the project `name`
# ("meridian"), Pixi keys each detached environment by a hash of the
# resolved project path — confirmed live via `environments_info[].prefix` in
# `pixi info --json`: two worktrees resolve to two DIFFERENT directories
# under the detached-environments root, e.g.
# `<root>/meridian-9641266968162128105/envs/default`. Deleting a worktree
# (`git worktree remove`, or this repo's own
# `meridian.worktree_cleanup.remove_worktree_on_disk`) NEVER touches this
# external, keyed directory — it only knows about the git-tracked tree. Left
# alone, detached environments simply accumulate externally forever instead
# of internally. `meridian/pixi_env_retention.py` + `meridian/orphan_reaper.py`
# are the retention/reclaim half of this fix: they register (and later
# discover + reclaim) each worktree's resolved external env root once it's
# gone, via `meridian/db/worktrees.py`'s `pixi_env_roots` table plus a
# marker file written into the resolved directory (defense-in-depth, works
# even without DB access).
#
# Also do not store package caches, databases, or other generated artifacts
# inside a worktree tree — see `meridian.pixi_env_retention.GENERATED_CACHE_DIR_NAMES`
# / `plan_worktree_cache_cleanup` for the same principle applied to
# `.pixi`/`node_modules`/test-cache directories that end up inside a
# worktree despite all this (e.g. a worktree used before detached
# environments were configured on that machine).

[workspace]
name = "meridian"
version = "0.1.0-pre-alpha"
description = "Multi-session Claude coordinator MCP server"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.11,<3.13"
fastapi = ">=0.115"
uvicorn = ">=0.30"
aiosqlite = ">=0.20"
pydantic = ">=2.0,<3"
jinja2 = ">=3.1"
httpx = ">=0.27"
pytest = ">=8.0"
pytest-asyncio = ">=0.23"
pytest-xdist = ">=3.5"
pytest-cov = ">=4.0"
# 343cb26d — per-test wall-clock kill so a single hung test (lingering asyncio
# loop / subprocess) can't keep the CI job alive indefinitely. Used via
# --timeout=60 in the test tasks below + the test.yml workflow.
pytest-timeout = ">=2.1"
beautifulsoup4 = ">=4.12"
git-cliff = ">=2.13.1,<3"
# 06df6ab3 — Word equation (OMML) indexing needs real XML/XSLT tooling (never a
# PDF round-trip); the recursive outputs indexer needs duckdb (unified CSV/JSON
# glob index) + numpy (.npy metadata only, mmap'd — never full-array content) +
# watchdog (filesystem events). NOTE: watchdog, NOT watchfiles — watchfiles
# deadlocks the Windows ProactorEventLoop; watchdog uses ReadDirectoryChangesW on
# Windows and is fine.
lxml = ">=5.0"
duckdb = ">=1.0"
numpy = ">=1.26"
watchdog = ">=4.0"

[pypi-dependencies]
# d45c2cc8 — detachable doc-intelligence sub-package (docs_intel + latex_intel).
# Editable path install so `import docparse` resolves for the app + test suite while
# the code lives standalone in packages/docparse/ (pip install -e ./packages/docparse).
meridian-docparse = { path = "packages/docparse", editable = true }
# 2b2433ca -- CodeIndex (BM25 local code search) extracted into its own
# standalone, zero-Meridian-dependency package. Editable path install so
# `import meridian_codeindex` resolves for the app + test suite while the code
# lives standalone in extensions/meridian-codeindex/ (pip install -e
# ./extensions/meridian-codeindex). meridian/code_index.py is now a thin
# compatibility shim over this package (same pattern as docs_intel.py above).
meridian-codeindex = { path = "extensions/meridian-codeindex", editable = true }
# 52cbe5d8 -- extensions/meridian-outputs declares tantivy/xxhash as real,
# non-optional runtime deps (see its own pyproject.toml), but its tests import
# the module straight off sys.path (no pip install of that package), so
# nothing previously pulled these into THIS pixi env. A fresh clone/worktree
# was silently missing both, making every Tantivy-backed test fail with a
# swallowed ModuleNotFoundError (caught by outputs_local.py's broad
# best-effort excepts) instead of exercising the real code path -- this is
# what produced a totally different failure signature than the one actually
# under investigation for 52cbe5d8 until this was caught and fixed.
tantivy = ">=0.22"
xxhash = ">=3.4"
mcp = ">=1.0"
anthropic = ">=0.40"
python-dotenv = ">=1.0"
psycopg = {version = ">=3.1", extras = ["binary"]}
psycopg-pool = ">=3.2"
# 0bfde7ad — Redis push augmentation for session_messages (meridian/redis_bridge.py).
# Deployed-app path only (MERIDIAN_REDIS_URL, a Fly-provisioned Redis reachable
# over Fly's private network); every redis_bridge function no-ops safely when
# it's unset, so this has zero effect on local/self-hosted installs.
redis = ">=5.0"
websockets = ">=12.0"
watchfiles = ">=0.21"
authlib = ">=1.3"
itsdangerous = ">=2.1"
resend = ">=0.7"
bcrypt = ">=4.0"
slowapi = ">=0.1"
playwright = ">=1.40"
# Tree-sitter core + grammars — foundation for symbol-level parallel protection
# (sprint 4bac57ff). Python uses stdlib `ast`; these cover the other languages.
tree-sitter = ">=0.21"
tree-sitter-python = ">=0.21"
tree-sitter-javascript = ">=0.21"
tree-sitter-typescript = ">=0.21"
tree-sitter-c = ">=0.21"
tree-sitter-cpp = ">=0.21"
tree-sitter-go = ">=0.21"
tree-sitter-rust = ">=0.21"
tree-sitter-java = ">=0.21"
tree-sitter-c-sharp = ">=0.21"
pylatexenc = ">=2.10, <3"
# 06df6ab3 — pure-Python LaTeX -> MathML (piped through doc_store's own hand-
# written MathML -> OOXML <m:oMath> mapper; see meridian/doc_store.py for why
# this does NOT use Microsoft's MML2OMML.XSL stylesheet).
latex2mathml = ">=3.77"

# Dev/build-only deps — not installed on Fly (Dockerfile uses pyproject.toml via uv).
# Use `pixi run -e dev <task>` for docs, exe builds, and media scripts.
[feature.dev.dependencies]
ffmpeg = ">=8.1.1,<9"

[feature.dev.pypi-dependencies]
ruff = ">=0.4"
pyinstaller = ">=6.0"
mkdocs-material = ">=9.5"
imageio = { version = ">=2.37.3, <3", extras = ["ffmpeg"] }
soundfile = ">=0.13.1, <0.14"
google-api-python-client = ">=2.197.0, <3"
google-auth-oauthlib = ">=1.4.0, <2"
fpdf2 = ">=2.7"

[environments]
dev = { features = ["dev"], solve-group = "default" }

[tasks]
start = { cmd = "python -m meridian", env = { MERIDIAN_CLAUDE_CLI = "cmd /c C:/Users/13144/AppData/Roaming/npm/claude.cmd -p" } }
dev = "uvicorn meridian.server:app --reload --port 7878"
# test_rate_limit_serial.py is excluded from every -n auto sweep below and run
# serially afterward — the moving-window rate-limit tests in it depend on real
# wall-clock deltas between their own requests, which parallel-worker CPU
# load (worse under --cov tracing) can stretch past the window and mask a
# working limiter as broken. See that file's module docstring.
# 2026-07-28 — worker count changed 3 -> auto (Adam: local runs were too slow).
test = "pytest tests/ -n auto -q --tb=short --ignore=tests/test_demo_ux.py --ignore=tests/test_rate_limit_serial.py --timeout=60 && pytest tests/test_rate_limit_serial.py -q --tb=short -p no:xdist --timeout=60"
# KEYSTONE 98aa7eb7 — run the SAME suite against real Postgres. The `db`/`client`
# fixtures (tests/conftest.py) route to Postgres whenever TEST_DATABASE_URL is set,
# so bugs SQLite :memory: hides (e.g. b7f41c73 datetime serialization) surface.
# Set the URL first, e.g.:
#   TEST_DATABASE_URL=postgresql://meridian:meridian@localhost:5432/meridian_test pixi run test-pg
# Mirrors the CI `test-postgres` job in .github/workflows/test.yml.
test-pg = "pytest tests/ -n auto -q --tb=short --ignore=tests/test_demo_ux.py --ignore=tests/test_rate_limit_serial.py --timeout=60 && pytest tests/test_rate_limit_serial.py -q --tb=short -p no:xdist --timeout=60"
test-cov = "pytest tests/ -n auto -q --tb=short --ignore=tests/test_demo_ux.py --ignore=tests/test_rate_limit_serial.py --timeout=60 --cov=meridian --cov-config=.coveragerc && pytest tests/test_rate_limit_serial.py -q --tb=short -p no:xdist --timeout=60 --cov=meridian --cov-config=.coveragerc --cov-append --cov-report=term-missing --cov-fail-under=80"
test-fast = "pytest tests/test_core.py tests/test_new_v25.py tests/test_hosted.py tests/test_github.py tests/test_milestones.py tests/test_md_anchors.py tests/test_security.py tests/test_ui.py tests/test_executor_runs.py tests/test_error_alerting.py tests/test_v2_hosted.py -n 3 -q --tb=short"
build-exe = "pyinstaller meridian.spec --clean"
build-connect = "pyinstaller meridian-connect.spec --clean"
smoke-bundle = "node scripts/smoke_bundle.mjs"
demo = "python scripts/demo.py"
test-mcp = "python scripts/test_mcp.py"
docs-serve = "mkdocs serve"
docs-build = "mkdocs build"
lint = "ruff check ."
changelog = "git-cliff --output CHANGELOG.md"
generate-files = "python scripts/generate_repo_files.py"
smoke-test-preview = "python scripts/smoke_test.py --url https://meridian-preview.fly.dev"
smoke-test-local = "python scripts/smoke_test.py --url http://localhost:7878"
funnel-smoke = "python scripts/funnel_smoke.py --url https://usemeridian.us"
test-live = "python scripts/test_live.py --skip-neon"
test-live-full = "python scripts/test_live.py"
test-auth = "python scripts/test_auth_flow.py"
test-waitlist = "python scripts/test_waitlist_db.py"
test-hooks = "python scripts/test_hooks_live.py --skip-live"
test-hooks-live = "python scripts/test_hooks_live.py"
# d188b408 — k6 load smoke tests (needs the k6 binary + a live target; never run
# against prod). Override the target: BASE_URL=https://... pixi run load-k6-signup
load-k6-signup = "k6 run k6/signup_smoke.js"
load-k6-mcp = "k6 run k6/mcp_tools.js"
test-mcp-tools = "python scripts/test_mcp_tools.py"
test-tenancy = "python scripts/test_tenancy.py"
launch = "python scripts/launch_morning.py"
starter = "python scripts/starter_handoff.py"
install-companions = "npm install -g repomix && pixi run install-browsers && echo Companions installed"
install-browsers = "playwright install chromium"
mcp = "python -m meridian --mcp"
executor = "python scripts/run_executor.py"
text-editor-mcp = { cmd = "pixi run python -m mcp_text_editor", cwd = "extensions/mcp-text-editor" }
repomix-mcp = "npx repomix --mcp"
