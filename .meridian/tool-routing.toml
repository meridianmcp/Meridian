# Tool-routing rules for this repo (e5a7ce7f). Owner rules approved 2026-11-02.
#
# meridian/tool_routing.py reads this file with load_routing_config(). It
# validates the whole file and fails closed on any schema error. Unknown rule
# fields are rejected, and the schema has no enabled flag, so a disabled rule
# is a commented-out [[rules]] block. It stays inert until someone uncomments it.
#
# Each rule's reason goes in `notes`, the only free-text field the schema
# accepts. Do not put absolute local paths or secrets in this file.
#
# Defaults apply to [routing]: mode = "shadow", confidence_threshold = 0.6.

# ENABLED. Database questions go to Neon, the hosted Postgres.
[[rules]]
id = "neon-database"
priority = 40
match_keywords = ["neon", "postgres", "postgresql", "sql", "database"]
category = "database"
tool = "neon"
notes = "Owner rule (2026-11-02): Neon answers database questions. Keywords are substring matches, so a code question that names Postgres also matches this rule. Code-read rules outrank it when both match."

