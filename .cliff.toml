# git-cliff config — generates CHANGELOG.md from commit history
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = """
# Meridian Changelog

All notable changes to Meridian. Generated from git history via `git-cliff`.

"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] — {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [unreleased]
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | split(pat="\\n") | first | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/meridianmcp/Meridian/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}
"""
footer = """
"""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix",  group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^infra", group = "Infrastructure" },
    { message = "^ci",   group = "Infrastructure" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^chore", group = "Chores" },
    { message = ".*", group = "Other" },
]
filter_commits = false
tag_pattern = "v[0-9]+.*"
ignore_tags = ""
topo_order = false
sort_commits = "newest"
