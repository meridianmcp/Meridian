[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian-outputs"
description = "Standalone local MCP server for outputs indexing (CSV/JSON/NPY) — wave-1 stopgap extracted from Meridian. Runs fully locally against a real outputs_dir, no hosted call."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Adam Camerer" }]
keywords = ["mcp", "outputs", "indexer", "fts", "duckdb", "csv", "json", "npy"]
version = "0.1.0"
dependencies = [
    "mcp>=1.0",
    "duckdb>=0.10",
    "watchdog>=4.0",
]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]

[project.scripts]
# Entry-point is "meridian-outputs-mcp" (NOT "meridian-outputs") to avoid a uvx
# name-collision bug where the command name matches the package name exactly.
meridian-outputs-mcp = "meridian_outputs.server:main"

[project.urls]
Homepage = "https://usemeridian.us"
Source = "https://github.com/meridianmcp/meridian"

[tool.hatch.build.targets.wheel]
packages = ["meridian_outputs"]
