[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian-outputs"
description = "Standalone local MCP server for outputs indexing (CSV/JSON/NPY) — wave-1 stopgap extracted from Meridian. Runs fully locally against a real outputs_dir, no hosted call."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Adam Camerer" }]
keywords = ["mcp", "outputs", "indexer", "fts", "duckdb", "csv", "json", "npy"]
version = "0.1.0"
dependencies = [
    "mcp>=1.0",
    "duckdb>=0.10",
    "watchdog>=4.0",
    # 279448b4 -- official Tantivy Python bindings (quickwit-oss/tantivy-py on
    # GitHub) publish to PyPI under the package name "tantivy", NOT
    # "tantivy-py" -- that latter name is a different, essentially abandoned
    # PyPI package (3 releases, last an rc, unrelated author). Verified via
    # PyPI JSON API + GitHub search before adding.
    "tantivy>=0.22",
    # 984b237c -- xxHash (XXH3-128) replaces SHA-256 as the hasher behind
    # OutputsFtsIndex's archival-duplicate-detection ("is this file byte-
    # identical to its canonical twin?") check -- non-cryptographic use
    # case, real measured speedup on large files (see
    # TestXxh3Benchmark/_xxh3_file's docstring). outputs_local.py lazily
    # imports this and degrades to SHA-256 if it's ever missing at runtime,
    # but it's declared as a real, non-optional dependency here so a normal
    # install always gets the fast path.
    "xxhash>=3.4",
    # e8a2f710 -- pyarrow backs OutputsFtsIndex.rebuild()'s Phase-2 bulk
    # insert: registering a pyarrow Table and running INSERT ... SELECT
    # bypasses DuckDB's parameter-bound VALUES insert path entirely.
    # Measured live: a 2000-row/11-col batch that cost ~17s through any
    # parameter-bound insert (executemany, a raw loop, a single combined
    # multi-row VALUES statement, or a columnar UNNEST bind -- all land in
    # the same order of magnitude) drops to ~0.11s via Arrow registration
    # (~150x faster). outputs_local.py lazily imports this and degrades to
    # the combined-VALUES path (still ~40% faster than plain executemany)
    # if it's ever missing at runtime, but it's declared as a real,
    # non-optional dependency here so a normal install always gets the
    # fast path -- same policy as xxhash above.
    "pyarrow>=14.0",
    # b85394bd -- psutil backs the adaptive Phase-1 batch-size probe
    # (OutputsFtsIndex._initial_adaptive_batch/_adaptive_batch_limit) and the
    # physical-core-count default for the analysis worker pool
    # (_physical_core_count). Both call sites already lazily import it and
    # degrade gracefully (the 4k safety-floor batch, os.cpu_count() workers)
    # when it's missing at runtime, but leaving it undeclared here meant a
    # `pixi run` install (which happens to pull psutil in transitively via an
    # unrelated dependency) and a standalone `uvx --from <path>
    # meridian-outputs-mcp` install (which does NOT) silently diverged in
    # which code path ran -- the exact non-determinism this item exists to
    # close. Declared as a real, non-optional dependency here so a normal
    # install always gets the memory-adaptive path, same policy as xxhash/
    # pyarrow above.
    "psutil>=5.9",
]

[project.optional-dependencies]
numpy = ["numpy>=1.24"]

[project.scripts]
# Entry-point is "meridian-outputs-mcp" (NOT "meridian-outputs") to avoid a uvx
# name-collision bug where the command name matches the package name exactly.
meridian-outputs-mcp = "meridian_outputs.server:main"

[project.urls]
Homepage = "https://usemeridian.us"
Source = "https://github.com/meridianmcp/meridian"

[tool.hatch.build.targets.wheel]
packages = ["meridian_outputs"]
