[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meridian-docs"
description = "Standalone, stdlib-only OOXML (DOCX) intelligence as an MCP server — the parser layer extracted from Meridian."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Adam Camerer" }]
keywords = ["mcp", "docx", "ooxml", "documents", "thesis"]
# The DOCX parser (docs_intel) is stdlib-only; the only runtime dep is the
# MCP SDK. document_content_tree for ingest_local_document_structure is a
# vendored local copy (meridian_docs/_vendored_content_tree.py), not a
# cross-package docparse dependency -- uvx's isolated --from <path>
# environments do not reliably resolve path-based [tool.uv.sources]
# dependencies (confirmed live, 2026-07-14).
version = "0.1.2"
dependencies = ["mcp>=1.0"]

[project.scripts]
# 58a044c7 — renamed from "meridian-docs" to "meridian-docs-mcp" to avoid the
# uvx name-collision bug: `uvx --from <local-path> meridian-docs` fails with
# "meridian-docs was not found in the package registry" because the command name
# matches the package name exactly, causing uvx to attempt a PyPI lookup for the
# command after installing from the local path. Using a distinct entry-point name
# (`meridian-docs-mcp`) breaks the ambiguity: the `--from` still installs from
# the local path, but `meridian-docs-mcp` is unambiguously a local script name,
# not a PyPI package to fetch. The tunnel_client command is updated in lockstep.
meridian-docs-mcp = "meridian_docs.server:main"

[project.urls]
Homepage = "https://usemeridian.us"
Source = "https://github.com/meridianmcp/meridian-docs"

[tool.hatch.build.targets.wheel]
packages = ["meridian_docs"]
