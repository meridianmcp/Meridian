[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# 6ee033c0 — the [project] name must not be the bare "meridian-docs" string:
# `uvx --from <local-path> <entry-point>` resolves the local path's distribution
# name and, when that resolved name matches (or is registry-lookup-ambiguous
# with) the trailing command argument, uv can still attempt a PyPI registry
# lookup even though 58a044c7 already renamed the console-script entry-point to
# "meridian-docs-mcp". Renaming the distribution name itself to
# "meridian-docs-mcp" removes the ambiguity at the source instead of relying
# solely on the entry-point rename. (No uv flag reliably suppresses the
# registry validation for `--from` installs across current uv versions, so the
# name rename is the robust fix.)
name = "meridian-docs-mcp"
description = "Standalone, stdlib-only OOXML (DOCX) intelligence as an MCP server — the parser layer extracted from Meridian."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Adam Camerer" }]
keywords = ["mcp", "docx", "ooxml", "documents", "thesis"]
# The DOCX parser (docs_intel) is mostly stdlib-only; the MCP SDK is the only
# runtime dep for the read/caption/citation tools.  a80af3a0 adds latex2mathml
# for the equation write path (LaTeX -> MathML -> OMML): it is pure Python with
# no C extension, safe for uvx isolated installs.  document_content_tree for
# ingest_local_document_structure is a vendored local copy
# (meridian_docs/_vendored_content_tree.py), not a cross-package docparse
# dependency -- uvx's isolated --from <path> environments do not reliably
# resolve path-based [tool.uv.sources] dependencies (confirmed live, 2026-07-14).
# 106caa76 — mcp was previously >=1.0 with no upper bound. Live tunnel evidence:
# an isolated `uvx --from <path>` child resolved mcp==2.0.0, which removed the
# `mcp.server.fastmcp` import this server uses (see server.py), crashing on
# startup. Pinned below the v2 major so uvx cannot resolve an incompatible SDK;
# see tests/test_tunnel_extension_dependencies.py for the regression coverage.
version = "0.1.2"
dependencies = ["mcp>=1.27,<2", "latex2mathml>=2.0"]

[project.scripts]
# 58a044c7 — renamed from "meridian-docs" to "meridian-docs-mcp" to avoid the
# uvx name-collision bug: `uvx --from <local-path> meridian-docs` fails with
# "meridian-docs was not found in the package registry" because the command name
# matches the package name exactly, causing uvx to attempt a PyPI lookup for the
# command after installing from the local path. Using a distinct entry-point name
# (`meridian-docs-mcp`) breaks the ambiguity: the `--from` still installs from
# the local path, but `meridian-docs-mcp` is unambiguously a local script name,
# not a PyPI package to fetch. The tunnel_client command is updated in lockstep.
meridian-docs-mcp = "meridian_docs.server:main"

[project.urls]
Homepage = "https://usemeridian.us"
Source = "https://github.com/meridianmcp/meridian-docs"

[tool.hatch.build.targets.wheel]
packages = ["meridian_docs"]
