<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meridian Checkpoint</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0d0d0f;
    color: #e8eaf0;
    width: 300px;
    padding: 16px;
    font-size: 13px;
  }
  h1 { font-size: 14px; font-weight: 700; margin-bottom: 4px; color: #a78bfa; }
  .subtitle { font-size: 11px; color: #8b9cba; margin-bottom: 16px; }
  label { display: block; font-size: 11px; color: #8b9cba; margin-bottom: 4px; margin-top: 12px; }
  input[type="text"], input[type="number"] {
    width: 100%;
    background: #1a1b1e;
    border: 1px solid #2d3148;
    border-radius: 4px;
    color: #e8eaf0;
    padding: 6px 8px;
    font-size: 12px;
    font-family: 'IBM Plex Mono', monospace;
  }
  input:focus { outline: none; border-color: #a78bfa; }
  .row { display: flex; align-items: center; gap: 8px; margin-top: 12px; }
  .row label { margin: 0; flex: 1; }
  input[type="checkbox"] { accent-color: #a78bfa; }
  .save-btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 8px;
    background: #7c3aed;
    border: none;
    border-radius: 4px;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .save-btn:hover { background: #6d28d9; }
  .status { margin-top: 8px; font-size: 11px; color: #34d399; min-height: 16px; text-align: center; }
  .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #4b5563; margin-top: 16px; margin-bottom: 4px; }
</style>
</head>
<body>
<h1>⚡ Meridian Checkpoint</h1>
<p class="subtitle">Auto-checkpoint claude.ai sessions</p>

<div class="section-title">Connection</div>
<label for="meridian-url">Meridian server URL</label>
<input type="text" id="meridian-url" placeholder="http://localhost:7878" value="http://localhost:7878">

<label for="project-id">Project ID</label>
<input type="text" id="project-id" placeholder="your-project-uuid">

<div class="section-title">Trigger</div>
<div class="row">
  <input type="checkbox" id="enabled" checked>
  <label for="enabled">Fire checkpoint when "checkpoint" appears in message</label>
</div>

<div class="section-title">Timer (optional)</div>
<div class="row">
  <input type="checkbox" id="timer-enabled">
  <label for="timer-enabled">Auto-checkpoint every</label>
  <input type="number" id="timer-minutes" value="30" min="5" max="240" style="width:60px">
  <span style="color:#8b9cba;font-size:11px">min</span>
</div>

<button class="save-btn" id="save-btn">Save settings</button>
<div class="status" id="status"></div>

<script>
  const $ = id => document.getElementById(id);

  // Load saved settings
  chrome.storage.sync.get(
    ['meridianUrl', 'projectId', 'enabled', 'timerEnabled', 'timerMinutes'],
    (items) => {
      if (items.meridianUrl) $('meridian-url').value = items.meridianUrl;
      if (items.projectId) $('project-id').value = items.projectId;
      $('enabled').checked = items.enabled !== false;
      $('timer-enabled').checked = !!items.timerEnabled;
      if (items.timerMinutes) $('timer-minutes').value = items.timerMinutes;
    }
  );

  $('save-btn').onclick = () => {
    const settings = {
      meridianUrl: $('meridian-url').value.trim() || 'http://localhost:7878',
      projectId: $('project-id').value.trim(),
      enabled: $('enabled').checked,
      timerEnabled: $('timer-enabled').checked,
      timerMinutes: parseInt($('timer-minutes').value) || 30,
    };
    chrome.storage.sync.set(settings, () => {
      const s = $('status');
      s.textContent = 'Saved!';
      setTimeout(() => { s.textContent = ''; }, 2000);
    });
  };

  // Test connection button could go here in v2
</script>
</body>
</html>
