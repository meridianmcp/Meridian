description = "Isolated pixi subenv for mcp-text-editor (requires Python >=3.13)"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-arm64", "osx-64"]

[dependencies]
python = ">=3.13"

[pypi-dependencies]
mcp-text-editor = ">=0.1"
