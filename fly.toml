app = "meridian-hosted"
# Multi-region HA: iad (Ashburn) is primary, ord (Chicago) is the secondary so a
# single-region outage can't take prod down. Machines-platform apps don't declare
# regions in fly.toml — placement is set by `fly scale count` (see the
# ensure-regions job in .github/workflows/deploy.yml, which spreads machines
# across iad,ord after every prod deploy). Idle machines auto-stop, so the
# secondary region adds HA at near-zero steady-state cost.
primary_region = "iad"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  [http_service.concurrency]
    type = "requests"
    hard_limit = 30
    soft_limit = 25

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
  max_count = 40

[checks]
  [checks.health]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/health"
    port = 8000
    timeout = "5s"
    type = "http"
