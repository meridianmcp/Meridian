site_name: Meridian
site_description: Shared memory for your AI sessions — MCP server for Claude, Cursor, Windsurf
site_url: https://docs.usemeridian.us
repo_url: https://github.com/meridianmcp/Meridian
repo_name: meridianmcp/Meridian
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    scheme: slate
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github
  font:
    text: Inter
    code: JetBrains Mono

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - Browser Connector: browser-connector.md
  - MCP Tools: mcp-tools.md
  - Hosted (usemeridian.us): hosted.md
  - Self-Hosting: self-hosting.md
  - Team Self-Hosting: team-self-hosting.md
  - Configuration: configuration.md
  - Safety Limits: safety-limits.md
  - API Reference: api-reference.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra:
  homepage: https://usemeridian.us
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/meridianmcp/Meridian
    - icon: fontawesome/solid/envelope
      link: mailto:hello@usemeridian.us
  analytics:
    provider: google
    property: G-PLACEHOLDER
