<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Changelog &mdash; Meridian</title>
<style>
  :root { --bg:#0d0d0f;--surface:#16181c;--border:#2a2d35;--accent:#6c8fff;--text:#e8eaf0;--muted:#8b8fa8;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace; }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.7;padding:2rem}
  .wrap{max-width:760px;margin:0 auto}
  nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:2.5rem}
  .logo{font-weight:700;font-size:1.1rem;color:var(--text);text-decoration:none}
  a{color:var(--accent);text-decoration:none} a:hover{text-decoration:underline}
  h1{font-size:1.8rem;font-weight:800;margin-bottom:.4rem}
  .meta{color:var(--muted);font-size:.85rem;margin-bottom:2rem}
  .entry{border-bottom:1px solid var(--border);padding:1.5rem 0}
  .entry:last-child{border-bottom:none}
  .entry-title{font-size:1.05rem;font-weight:700;color:var(--text);margin-bottom:.6rem}
  .entry-body{color:var(--muted);font-size:.92rem;white-space:pre-wrap;word-break:break-word;font-family:var(--mono)}
  .entry-body strong{color:var(--text);font-weight:600}
  .entry-body code{background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:1px 5px;font-size:.88em}
  footer{margin-top:3rem;padding-top:1.5rem;border-top:1px solid var(--border);color:var(--muted);font-size:.82rem;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<nav><a class="logo" href="/">⬡ Meridian</a><a href="/">← Back</a></nav>

<h1>Changelog</h1>
<div class="meta">Developer log — incidents, decisions, and shipped features</div>

{% for entry in entries %}
<div class="entry">
  <div class="entry-title">{{ entry.title }}</div>
  <div class="entry-body">{{ entry.body | safe }}</div>
</div>
{% endfor %}

<footer><a href="/">Meridian</a> &nbsp;·&nbsp; <a href="/terms">Terms</a> &nbsp;·&nbsp; <a href="/privacy">Privacy</a></footer>
</div>
</body>
</html>
