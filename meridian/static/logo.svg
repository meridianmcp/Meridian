<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer circle -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#6c8fff" stroke-width="2"/>
  <!-- Compass rose center -->
  <circle cx="32" cy="32" r="3" fill="#6c8fff"/>
  <!-- North needle (pointing NE) -->
  <polygon points="32,32 38,14 32,20" fill="#6c8fff"/>
  <!-- South needle -->
  <polygon points="32,32 26,50 32,44" fill="#6c8fff" opacity="0.4"/>
  <!-- Cardinal marks -->
  <line x1="32" y1="4" x2="32" y2="10" stroke="#6c8fff" stroke-width="2"/>
  <line x1="60" y1="32" x2="54" y2="32" stroke="#6c8fff" stroke-width="2"/>
  <line x1="32" y1="60" x2="32" y2="54" stroke="#6c8fff" stroke-width="2"/>
  <line x1="4" y1="32" x2="10" y2="32" stroke="#6c8fff" stroke-width="2"/>
</svg>
