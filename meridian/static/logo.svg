<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Hexagon outline -->
  <polygon points="32,4 56,18 56,46 32,60 8,46 8,18"
    stroke="#5b7fff" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <!-- 6 spokes from center to vertices -->
  <line x1="32" y1="32" x2="32" y2="4"   stroke="#5b7fff" stroke-width="1.5" opacity="0.7"/>
  <line x1="32" y1="32" x2="56" y2="18"  stroke="#5b7fff" stroke-width="1.5" opacity="0.7"/>
  <line x1="32" y1="32" x2="56" y2="46"  stroke="#5b7fff" stroke-width="1.5" opacity="0.7"/>
  <line x1="32" y1="32" x2="32" y2="60"  stroke="#5b7fff" stroke-width="1.5" opacity="0.7"/>
  <line x1="32" y1="32" x2="8"  y2="46"  stroke="#5b7fff" stroke-width="1.5" opacity="0.7"/>
  <line x1="32" y1="32" x2="8"  y2="18"  stroke="#5b7fff" stroke-width="1.5" opacity="0.7"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3.5" fill="#7c5cfc"/>
</svg>
