[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths = tests
pythonpath = .
filterwarnings =
    ignore::pytest.PytestUnraisableExceptionWarning
    ignore::pytest.PytestUnhandledThreadExceptionWarning
    ignore::DeprecationWarning
markers =
    subprocess_isolated: spawns a real OS subprocess (bash/PowerShell/python child) and must run OUTSIDE the -n auto xdist sweep -- concurrent xdist workers each spawning subprocesses have produced Windows NTSTATUS crash exit codes (ACCESS_VIOLATION, DLL_NOT_FOUND, CONTROL_C_EXIT) under heavy contention. Excluded from the main sweep and rerun as its own `--serial` step in pixi.toml's test/test-pg/test-cov tasks (4f3765c1), mirroring the existing test_rate_limit_serial.py isolation pattern.
