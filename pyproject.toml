requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.0,<3",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "toml>=0.10",
    "asyncpg>=0.29",
    "websockets>=12.0",
    "mcp>=1.0",
    "anthropic>=0.40",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "resend>=0.7",
    "bcrypt>=4.0",
    "slowapi>=0.1",
]
