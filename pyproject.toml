[project]
name = "meridian-server"
version = "0.1.9"
description = "Multi-session Claude coordinator MCP server"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.0,<3",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "websockets>=12.0",
    "mcp>=1.0",
    "anthropic>=0.40",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "resend>=0.7",
    # 0bfde7ad — optional Redis push augmentation. The bridge remains fail-open
    # when MERIDIAN_REDIS_URL is unset or Redis is unavailable, but the package
    # must be present in Docker/Fly installs built from pyproject.toml.
    "redis>=5.0",
    "bcrypt>=4.0",
    "slowapi>=0.1",
    # Tree-sitter core + grammars — symbol-level parallel protection (4bac57ff).
    # claim_file parses files server-side, so these must ship in the Fly image
    # (built from this file via `uv pip install --system .`).
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-c>=0.21",
    "tree-sitter-cpp>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-java>=0.21",
    "tree-sitter-c-sharp>=0.21",
    # Native LaTeX source parsing — docs_intel Phase 3 (106118cd). Pure-Python
    # latexwalker parser (no PDF intermediary); ships in the Fly image so the
    # get_latex_structure MCP tool works server-side.
    "pylatexenc>=2.10,<3",
    # 06df6ab3 — Word equation (OMML) indexing: lxml for real XML/XSLT-capable
    # parsing of <m:oMath> straight out of word/document.xml (never a PDF
    # round-trip), latex2mathml for pure-Python LaTeX -> MathML (piped through
    # doc_store's own hand-written MathML -> OOXML mapper — see
    # meridian/doc_store.py for why this isn't Microsoft's MML2OMML.XSL).
    "lxml>=5.0",
    "latex2mathml>=3.77",
    # 06df6ab3 — recursive outputs indexer (meridian/outputs_indexer.py): duckdb
    # for the unified CSV/JSON glob index, numpy for .npy metadata (mmap'd —
    # never full-array content), watchdog for filesystem events. NOTE: watchdog,
    # NOT watchfiles — watchfiles deadlocks the Windows ProactorEventLoop;
    # watchdog uses ReadDirectoryChangesW on Windows and is fine.
    "duckdb>=1.0",
    "numpy>=1.26",
    "watchdog>=4.0",
]

[project.optional-dependencies]
# 56cd8712 — Model2Vec semantic-search escalation. OPTIONAL extra, NOT a base dep:
# it pulls numpy and a ~30MB static model (~90MB WARM RSS), which we keep off the
# 512MB prod box and out of base/CI installs. Opt in with:
#   uv pip install '.[semantic]'   (and set MERIDIAN_SEMANTIC_ENABLED=1)
# model2vec is numpy-only static embeddings (NO torch). psutil is used by the
# runtime RSS circuit breaker (semantic_search.rss_mb falls back to /proc if absent).
semantic = [
    "model2vec>=0.3",
    "psutil>=5.9",
]

[project.scripts]
# Console entry so `uv tool install meridian-server` / `pipx install` provide a
# `meridian` command (CLI dispatcher: `meridian --tunnel`, `meridian --mcp`, …).
meridian = "meridian.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian"]

[tool.ruff]
line-length = 120

# 736d300e — CI now runs ruff in TWO passes (see .github/workflows/test.yml `lint`):
#   1. BLOCKING: `ruff check .` uses the `lint.select` set below — a curated subset of
#      correctness-critical pyflakes rules that are ALREADY fully clean today (0 violations),
#      so enforcing them cannot red-wall CI while it stays clean. This is real linting: an
#      undefined name (F821), a broken %-format string (F50x), a bare `return`/`break`
#      outside a function/loop (F70x), or a `==` on a literal type (F632) now FAILS the build.
#   2. WARN-ONLY: a second step runs the broad default rule set with `|| true` so the noisy
#      style/import backlog (F401 x80, F405 x113, F841, F541, E4xx/E7xx, …) stays VISIBLE in
#      logs without blocking. Graduating those into `select` is tracked follow-up work:
#        - F401 (unused-import, 80): mostly `ruff --fix`-able, but interacts with __init__
#          re-exports and the F405 star-imports; needs a careful per-file pass.
#        - F811 (redefined-while-unused, 6): 6 REAL latent bugs (e.g. a shadowed duplicate
#          `test_sprint_item_delete` in tests, `_is_demo_request` imported AND redefined in
#          server.py) — each needs a deliberate fix, not a blanket rule flip.
#      Once a rule's count hits 0, move its code from the warn-only pass into `select` below.
[tool.ruff.lint]
# Correctness-critical rules enforced as BLOCKING. Every code here is at 0 violations as of
# 736d300e; adding a violation of any of them fails CI. Explicit codes (not whole `F`) so the
# blocking gate can't silently absorb a future noisy rule.
select = [
    # pyflakes — undefined names / unresolved locals (runtime NameError territory).
    "F821", # undefined-name
    "F822", # undefined-name-in-__all__
    "F823", # undefined-local (used before assignment)
    # pyflakes — malformed %-style / .format() string calls.
    "F501", "F502", "F503", "F504", "F505", "F506", "F507", "F508", "F509",
    "F521", "F522", "F523", "F524", "F525",
    # pyflakes — nonsensical comparisons / assertions.
    "F601", # `x is y` with str/bytes/int literal (== intended)
    "F602", # `x is not y` with literal
    "F631", # assert on a (non-empty) tuple — always true
    "F632", # use of == / != with a constant type (str/bytes/int) literal via `is`
    "F633", # invalid `print` with `>>` in py3
    "F634", # if-tuple — always true
    # pyflakes — statements in an illegal position (real syntax-level bugs).
    "F701", # break outside loop
    "F702", # continue outside loop
    "F704", # yield outside function
    "F706", # return outside function
    "F707", # except after bare except (unreachable handler)
]
# Non-blocking style backlog — kept out of `select` above. E501 (line-length) / E203 stay
# ignored outright so even the warn-only broad pass doesn't spam on them.
ignore = ["E501", "E203"]
