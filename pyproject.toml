[project]
name = "meridian-coordinator"
version = "0.1.0.dev1"
description = "Multi-session Claude coordinator MCP server"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.0,<3",
    "jinja2>=3.1",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "websockets>=12.0",
    "mcp>=1.0",
    "anthropic>=0.40",
    "authlib>=1.3",
    "itsdangerous>=2.1",
    "resend>=0.7",
    "bcrypt>=4.0",
    "slowapi>=0.1",
    # Tree-sitter core + grammars — symbol-level parallel protection (4bac57ff).
    # claim_file parses files server-side, so these must ship in the Fly image
    # (built from this file via `uv pip install --system .`).
    "tree-sitter>=0.21",
    "tree-sitter-python>=0.21",
    "tree-sitter-javascript>=0.21",
    "tree-sitter-typescript>=0.21",
    "tree-sitter-c>=0.21",
    "tree-sitter-cpp>=0.21",
    "tree-sitter-go>=0.21",
    "tree-sitter-rust>=0.21",
    "tree-sitter-java>=0.21",
    "tree-sitter-c-sharp>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["meridian"]
